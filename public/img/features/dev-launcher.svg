<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Chakra Petch', 'Segoe UI', system-ui">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1a2130" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="400" fill="url(#bg)"/>
  <rect width="900" height="400" fill="url(#grid)"/>

  <text x="40" y="46" fill="#9fb0ff" font-size="15" letter-spacing="2">NUI DEV LAUNCHER — 18 ENTRIES → 44</text>
  <text x="40" y="70" fill="#6d7a92" font-size="12">Every interface App.svelte can render now has a card, with mock data that speaks the real messages.</text>

  <g font-size="12">
    <!-- Terminals -->
    <rect x="40" y="92" width="196" height="284" rx="8" fill="#0f1420" stroke="#232c3e"/>
    <text x="56" y="116" fill="#6c8cff" font-size="11" letter-spacing="1.5">TERMINALS · 8</text>
    <text x="56" y="142" fill="#e7ecf5">LAPD MDT</text>
    <text x="56" y="162" fill="#e7ecf5">Dispatch Console</text>
    <text x="56" y="182" fill="#e7ecf5">LASD PCMS</text>
    <text x="56" y="202" fill="#e7ecf5">EMS / Fire CAD</text>
    <text x="56" y="222" fill="#e7ecf5">Agency MDT</text>
    <text x="56" y="242" fill="#e7ecf5">9100-T Terminal</text>
    <text x="56" y="262" fill="#e7ecf5">Pennsylvania CAD</text>
    <text x="56" y="282" fill="#e7ecf5">Supervisor Terminal</text>

    <!-- Screens -->
    <rect x="252" y="92" width="196" height="284" rx="8" fill="#0f1420" stroke="#2f3c58"/>
    <text x="268" y="116" fill="#4ad991" font-size="11" letter-spacing="1.5">SCREENS · 7  (NEW)</text>
    <text x="268" y="142" fill="#e7ecf5">Phone</text>
    <text x="268" y="162" fill="#e7ecf5">Phone — retro brick</text>
    <text x="268" y="182" fill="#e7ecf5">Spawn Select</text>
    <text x="268" y="202" fill="#e7ecf5">Session Window</text>
    <text x="268" y="222" fill="#e7ecf5">Mobile ID</text>
    <text x="268" y="242" fill="#e7ecf5">In-Car CAD</text>
    <text x="268" y="262" fill="#e7ecf5">In-Car MDT</text>

    <!-- Overlays -->
    <rect x="464" y="92" width="196" height="284" rx="8" fill="#0f1420" stroke="#232c3e"/>
    <text x="480" y="116" fill="#6c8cff" font-size="11" letter-spacing="1.5">OVERLAYS · 13</text>
    <text x="480" y="142" fill="#9fb0ff">Playerlist ×3</text>
    <text x="480" y="162" fill="#9fb0ff">CCTV · Civ menu · Radio log</text>
    <text x="480" y="182" fill="#9fb0ff">Director's Cut</text>
    <text x="480" y="206" fill="#4ad991">ALPR</text>
    <text x="480" y="226" fill="#4ad991">Air Unit Cam</text>
    <text x="480" y="246" fill="#4ad991">Turf HUD</text>
    <text x="480" y="266" fill="#4ad991">Civilian ID card</text>
    <text x="480" y="286" fill="#4ad991">AOP Vote</text>
    <text x="480" y="306" fill="#4ad991">911 Call Session</text>
    <text x="480" y="326" fill="#4ad991">Notifications</text>

    <!-- Panels -->
    <rect x="676" y="92" width="184" height="284" rx="8" fill="#0f1420" stroke="#232c3e"/>
    <text x="692" y="116" fill="#6c8cff" font-size="11" letter-spacing="1.5">PANELS · 16</text>
    <text x="692" y="142" fill="#9fb0ff">Profile · Big Brother</text>
    <text x="692" y="162" fill="#9fb0ff">Admin · Speech-to-Text</text>
    <text x="692" y="186" fill="#4ad991">Corrections</text>
    <text x="692" y="206" fill="#4ad991">Impound Lot</text>
    <text x="692" y="226" fill="#4ad991">CCTV Manager</text>
    <text x="692" y="246" fill="#4ad991">Vehicle / Prop Spawner</text>
    <text x="692" y="266" fill="#4ad991">Phone Booth</text>
    <text x="692" y="286" fill="#4ad991">Organisation</text>
    <text x="692" y="306" fill="#4ad991">Bug Report</text>
    <text x="692" y="326" fill="#4ad991">Zone Editor</text>
    <text x="692" y="346" fill="#4ad991">Civ / Vehicle record form</text>
  </g>

  <circle cx="46" cy="390" r="4" fill="#4ad991"/>
  <text x="58" y="394" fill="#6d7a92" font-size="11">green = added in this release</text>
</svg>
