<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/></marker>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/><rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 504 V532 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">CCTV — <tspan fill="#6c8cff">VIEWER · SCANNER · FIELD CAMS</tspan></text>

  <!-- Camera viewport -->
  <rect x="70" y="100" width="620" height="360" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="90" y="128" fill="#7dff7d" font-size="13" font-weight="700">● REC  CITY HALL — LOBBY</text>
  <text x="670" y="128" fill="#6b7689" font-size="12" font-weight="600" text-anchor="end">WASD look · scroll zoom</text>
  <!-- reticle on subject -->
  <g stroke="#7dff7d" stroke-width="3" fill="none">
    <path d="M250 210 h-34 v34"/><path d="M330 210 h34 v34"/>
    <path d="M250 330 h-34 v-34"/><path d="M330 330 h34 v-34"/>
  </g>
  <line x1="216" y1="272" x2="364" y2="272" stroke="#7dff7d" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="290" cy="240" rx="17" ry="20" fill="#1a2131"/>
  <path d="M262 330 Q262 278 290 274 Q318 278 318 330 Z" fill="#1a2131"/>
  <text x="290" y="360" fill="#7dff7d" font-size="13" font-weight="700" text-anchor="middle">SCANNING… 74%</text>
  <!-- reveal card -->
  <rect x="420" y="180" width="240" height="200" rx="8" fill="#0e1220" stroke="#4a5cff" stroke-width="2"/>
  <rect x="436" y="196" width="56" height="64" fill="#1a2131" stroke="#2c3650"/>
  <text x="504" y="212" fill="#e7ecf5" font-size="13" font-weight="700">J. DOE</text>
  <text x="504" y="230" fill="#9fb0ff" font-size="11" font-weight="600">DOB 04/12/1994</text>
  <text x="504" y="248" fill="#9fb0ff" font-size="11" font-weight="600">PRIORS: 3</text>
  <rect x="436" y="272" width="208" height="24" rx="4" fill="#3a0d0d" stroke="#d04a4a"/>
  <text x="540" y="289" fill="#ffb0b0" font-size="12" font-weight="700" text-anchor="middle">⚠ ACTIVE WARRANT</text>
  <rect x="436" y="302" width="208" height="24" rx="4" fill="#3a2a0d" stroke="#d08a2a"/>
  <text x="540" y="319" fill="#ffd9a0" font-size="12" font-weight="700" text-anchor="middle">BOLO ACTIVE</text>
  <text x="540" y="352" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">recent records — LEO/Security only</text>
  <line x1="364" y1="260" x2="412" y2="260" stroke="#4a5cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Right: field cams + map -->
  <g font-size="14" font-weight="700">
    <rect x="730" y="100" width="400" height="106" rx="12" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
    <text x="754" y="130" fill="#e7ecf5">📷 FIELD CAMERAS — /camtool + /cameras</text>
    <text x="754" y="154" fill="#6b7689" font-size="12">placement freecam · real props everyone sees</text>
    <text x="754" y="174" fill="#6b7689" font-size="12">persisted server-side · auto-grouped by locality</text>
    <text x="754" y="194" fill="#6b7689" font-size="12">“Field · Vinewood”, “Field · Sandy Shores”, …</text>

    <rect x="730" y="226" width="400" height="90" rx="12" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
    <text x="754" y="256" fill="#e7ecf5">🗺 DISPATCH MAP — 📹 markers</text>
    <text x="754" y="280" fill="#6b7689" font-size="12">click a marker → jump into the live camera,</text>
    <text x="754" y="300" fill="#6b7689" font-size="12">console reopens automatically when you leave</text>

    <rect x="730" y="336" width="400" height="90" rx="12" fill="none" stroke="#8a9a2f" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="754" y="366" fill="#dcea8a">🔒 GATED &amp; SAFE</text>
    <text x="754" y="390" fill="#8a9a2f" font-size="12">record lookup LEO/Security only · NPC scans resolve</text>
    <text x="754" y="410" fill="#8a9a2f" font-size="12">locally · only allow-listed prop models spawn</text>
  </g>

  <text x="60" y="505" fill="#6b7689" font-size="15" font-weight="600">Left-click a person or vehicle in the viewer: a 6-second targeting scan, then the card — mugshot, MDT summary, WARRANT / BOLO / STOLEN / UNREGISTERED flags.</text>
</svg>
