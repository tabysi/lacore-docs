<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/></marker>
  </defs>
  <rect width="1200" height="540" fill="url(#bg)"/><rect width="1200" height="540" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 484 V512 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">ENHANCED PLAYERBASE — <tspan fill="#6c8cff">SHARED REPUTATION</tspan></text>

  <!-- Community A -->
  <rect x="70" y="130" width="270" height="150" rx="12" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
  <text x="205" y="160" fill="#e7ecf5" font-size="15" font-weight="700" text-anchor="middle">YOUR COMMUNITY</text>
  <g font-size="12" font-weight="600" fill="#9fb0ff">
    <text x="94" y="188">data/banlist.json — /ban · /warn</text>
    <text x="94" y="210">+ txAdmin playersDB.json (auto-sync)</text>
  </g>
  <rect x="94" y="226" width="222" height="30" rx="6" fill="#0e1220" stroke="#4a5cff"/>
  <text x="205" y="246" fill="#9fb0ff" font-size="12" font-weight="700" text-anchor="middle">/lacore bans upload</text>

  <!-- Hash gate -->
  <line x1="340" y1="205" x2="430" y2="205" stroke="#2c3650" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="440" y="160" width="150" height="90" rx="10" fill="#0b0f0a" stroke="#8a9a2f" stroke-width="2"/>
  <text x="515" y="192" fill="#dcea8a" font-size="13" font-weight="700" text-anchor="middle">SHA-256</text>
  <text x="515" y="212" fill="#8a9a2f" font-size="11" font-weight="600" text-anchor="middle">identifiers hashed —</text>
  <text x="515" y="230" fill="#8a9a2f" font-size="11" font-weight="600" text-anchor="middle">raw ids never shared</text>
  <line x1="590" y1="205" x2="670" y2="205" stroke="#2c3650" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Playerbase -->
  <rect x="680" y="120" width="260" height="180" rx="12" fill="#0e1220" stroke="#4a5cff" stroke-width="3"/>
  <text x="810" y="152" fill="#e7ecf5" font-size="16" font-weight="700" text-anchor="middle">LACORE PLAYERBASE</text>
  <g font-size="12" font-weight="600" fill="#9fb0ff">
    <text x="704" y="182">players matched by hash</text>
    <text x="704" y="204">records keep provenance</text>
    <text x="704" y="226">👻 ghosts for unknown bans —</text>
    <text x="704" y="244">claimed on first connect</text>
  </g>
  <rect x="704" y="258" width="212" height="28" rx="6" fill="#1a1030" stroke="#8c14a8"/>
  <text x="810" y="277" fill="#d8a8ff" font-size="12" font-weight="700" text-anchor="middle">PBSHARE-XXXXX share key</text>

  <!-- Partner -->
  <line x1="940" y1="210" x2="1010" y2="210" stroke="#2c3650" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1020" y="150" width="110" height="120" rx="12" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
  <text x="1075" y="182" fill="#e7ecf5" font-size="13" font-weight="700" text-anchor="middle">PARTNER</text>
  <text x="1075" y="202" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">reads your</text>
  <text x="1075" y="218" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">records by key</text>
  <text x="1075" y="248" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">directional +</text>
  <text x="1075" y="262" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">revocable</text>

  <!-- Enforcement -->
  <rect x="70" y="340" width="1060" height="110" rx="12" fill="none" stroke="#d04a4a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="94" y="372" fill="#ffb0b0" font-size="15" font-weight="700">ENFORCEMENT — OPT-IN, TWO-SIDED</text>
  <text x="94" y="398" fill="#9fb0ff" font-size="13" font-weight="600">① owner flips the share key to “Enforce”   ②  the consuming server sets  <tspan fill="#dcea8a">setr lacore_playerbase_enforce true</tspan>   — only then does a shared ban block a connect</text>
  <text x="94" y="426" fill="#6b7689" font-size="13" font-weight="600">Fail-safe: the connect check never holds the deferral — no key, relay down, or any error simply lets the join proceed. Advisory by default.</text>

  <text x="60" y="500" fill="#6b7689" font-size="15" font-weight="600">Partners see the player's name and ban reason — never their identifiers. Requires a licence key; upload rides the write-only relay.</text>
</svg>
