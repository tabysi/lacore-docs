<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/><rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 504 V532 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">SECURITY &amp; ADMIN — <tspan fill="#6c8cff">THE STACK</tspan></text>

  <!-- Left: layer stack -->
  <g font-size="14" font-weight="700">
    <rect x="70" y="110" width="500" height="64" rx="10" fill="#0a0d13" stroke="#d04a4a" stroke-width="2"/>
    <text x="94" y="137" fill="#ffb0b0">🛡 ANTICHEAT — event honeypot</text>
    <text x="94" y="160" fill="#6b7689" font-size="12">guards server events · framework events whitelisted via the Bridge</text>

    <rect x="70" y="186" width="500" height="64" rx="10" fill="#0a0d13" stroke="#d08a2a" stroke-width="2"/>
    <text x="94" y="213" fill="#ffd9a0">🔑 PERMISSIONS — ACE groups + Discord bridge</text>
    <text x="94" y="236" fill="#6b7689" font-size="12">lacore_dev / lacore_staff / lacore_mod · Discord role → ACE · HasPermission()</text>

    <rect x="70" y="262" width="500" height="64" rx="10" fill="#0a0d13" stroke="#8a9a2f" stroke-width="2"/>
    <text x="94" y="289" fill="#dcea8a">⛔ BANS — safe connect validation</text>
    <text x="94" y="312" fill="#6b7689" font-size="12">malformed entries / DB hiccups can never stick a player on “Checking bans…”</text>

    <rect x="70" y="338" width="500" height="64" rx="10" fill="#0a0d13" stroke="#4a5cff" stroke-width="2"/>
    <text x="94" y="365" fill="#9fb0ff">🔒 IP-LOCK — licence enforcement</text>
    <text x="94" y="388" fill="#6b7689" font-size="12">author-side anti-piracy · not customer-configurable · escrow-encrypted</text>

    <rect x="70" y="414" width="500" height="64" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
    <text x="94" y="441" fill="#e7ecf5">📡 TELEMETRY — write-only relay</text>
    <text x="94" y="464" fill="#6b7689" font-size="12">server-level metadata only, fixed allow-list · never players, chat, secrets or DB</text>
  </g>

  <!-- Right: staff panel -->
  <rect x="620" y="110" width="510" height="368" rx="12" fill="#0e1220" stroke="#4a5cff" stroke-width="3"/>
  <text x="875" y="142" fill="#e7ecf5" font-size="17" font-weight="700" text-anchor="middle">/admin — STAFF PANEL</text>
  <!-- rail -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="644" y="160" width="130" height="40" rx="8" fill="#101a2e" stroke="#4a5cff"/><text x="709" y="185" fill="#9fb0ff">1 PLAYERS</text>
    <rect x="644" y="208" width="130" height="40" rx="8" fill="#0a0d13" stroke="#2c3650"/><text x="709" y="233" fill="#6b7689">2 LOG</text>
    <rect x="644" y="256" width="130" height="40" rx="8" fill="#0a0d13" stroke="#2c3650"/><text x="709" y="281" fill="#6b7689">3 SELF</text>
  </g>
  <g font-size="12" font-weight="600" fill="#9fb0ff">
    <text x="794" y="176">search · filter On duty / Civilian / Flagged</text>
    <text x="794" y="196">ping + anticheat trust score per row</text>
    <text x="794" y="224" fill="#6b7689">Big Brother: filter, page, live feed,</text>
    <text x="794" y="242" fill="#6b7689">per-player 30-day dossier · Discord mirror</text>
    <text x="794" y="272" fill="#6b7689">noclip · god · invis · repair — client-side</text>
  </g>
  <!-- tiers -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="644" y="316" width="150" height="52" rx="8" fill="#101a10" stroke="#2fae2f"/>
    <text x="719" y="338" fill="#7dff7d">LEAD DEV</text><text x="719" y="356" fill="#2fae2f" font-size="11">everything</text>
    <rect x="806" y="316" width="150" height="52" rx="8" fill="#1a1610" stroke="#d08a2a"/>
    <text x="881" y="338" fill="#ffd9a0">ADMIN</text><text x="881" y="356" fill="#d08a2a" font-size="11">+ jail &amp; ban</text>
    <rect x="968" y="316" width="150" height="52" rx="8" fill="#16101a" stroke="#8c14a8"/>
    <text x="1043" y="338" fill="#d8a8ff">MODERATOR</text><text x="1043" y="356" fill="#8c14a8" font-size="11">soft actions + kick</text>
  </g>
  <text x="875" y="400" fill="#6b7689" font-size="12" font-weight="600" text-anchor="middle">tiers are advisory — every action re-checks on the server</text>
  <text x="875" y="422" fill="#6b7689" font-size="12" font-weight="600" text-anchor="middle">kick / jail / ban need a reason + confirmation → log line + Discord embed</text>
  <text x="875" y="456" fill="#9fb0ff" font-size="12" font-weight="700" text-anchor="middle">/bblog opens the same window on its log view</text>

  <text x="60" y="520" fill="#6b7689" font-size="15" font-weight="600">Every layer is server-authoritative — the client only ever sees what it may do, never decides it.</text>
</svg>
