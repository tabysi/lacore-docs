<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/></marker>
  </defs>
  <rect width="1200" height="540" fill="url(#bg)"/><rect width="1200" height="540" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 484 V512 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">FRAMEWORK <tspan fill="#6c8cff">BRIDGE</tspan></text>

  <!-- Frameworks -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="80" y="120" width="200" height="60" rx="10" fill="#0a0d13" stroke="#d08a2a" stroke-width="2"/><text x="180" y="157" fill="#ffd9a0">ESX</text>
    <rect x="80" y="200" width="200" height="60" rx="10" fill="#0a0d13" stroke="#d04a4a" stroke-width="2"/><text x="180" y="237" fill="#ffb0b0">QBCore</text>
    <rect x="80" y="280" width="200" height="60" rx="10" fill="#0a0d13" stroke="#4ad0a0" stroke-width="2"/><text x="180" y="317" fill="#a0ffd9">QBox</text>
    <rect x="80" y="360" width="200" height="60" rx="10" fill="none" stroke="#2c3650" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="180" y="390" fill="#6b7689" font-size="13">no framework?</text><text x="180" y="408" fill="#6b7689" font-size="12">LACORE's own /char</text>
  </g>
  <g stroke="#2c3650" stroke-width="2">
    <line x1="280" y1="150" x2="430" y2="230" marker-end="url(#arr)"/>
    <line x1="280" y1="230" x2="430" y2="255" marker-end="url(#arr)"/>
    <line x1="280" y1="310" x2="430" y2="280" marker-end="url(#arr)"/>
  </g>

  <!-- Bridge -->
  <rect x="440" y="160" width="320" height="200" rx="12" fill="#0e1220" stroke="#4a5cff" stroke-width="3"/>
  <text x="600" y="192" fill="#e7ecf5" font-size="17" font-weight="700" text-anchor="middle">BRIDGE — auto-detected</text>
  <g font-size="13" font-weight="600" fill="#9fb0ff">
    <text x="466" y="222">GetJob · GetName · GetIdentifier</text>
    <text x="466" y="246">IsLeo / IsEms · Notify</text>
    <text x="466" y="270">jobMap → LACORE department</text>
    <text x="466" y="294">framework characters mirrored</text>
  </g>
  <rect x="466" y="312" width="268" height="30" rx="6" fill="#2a1a0d" stroke="#d08a2a"/>
  <text x="600" y="332" fill="#ffd9a0" font-size="12" font-weight="700" text-anchor="middle">identity read-only — framework stays truth</text>

  <!-- LACORE consumers -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="880" y="120" width="240" height="52" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="1000" y="152" fill="#e7ecf5">DUTY &amp; DEPARTMENTS</text>
    <rect x="880" y="192" width="240" height="52" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="1000" y="224" fill="#e7ecf5">MDT / CAD LOOKUPS</text>
    <rect x="880" y="264" width="240" height="52" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="1000" y="296" fill="#e7ecf5">VEHICLES &amp; LICENCES</text>
    <rect x="880" y="336" width="240" height="52" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="1000" y="368" fill="#e7ecf5">ANTICHEAT INTEROP</text>
  </g>
  <g stroke="#2c3650" stroke-width="2">
    <line x1="760" y1="210" x2="872" y2="150" marker-end="url(#arr)"/>
    <line x1="760" y1="245" x2="872" y2="220" marker-end="url(#arr)"/>
    <line x1="760" y1="290" x2="872" y2="290" marker-end="url(#arr)"/>
    <line x1="760" y1="325" x2="872" y2="360" marker-end="url(#arr)"/>
  </g>

  <text x="60" y="480" fill="#6b7689" font-size="15" font-weight="600">A framework job that maps to an agency counts as duty authorisation — an ESX/QB officer goes on duty without a LACORE Discord role.</text>
  <text x="60" y="502" fill="#6b7689" font-size="15" font-weight="600">Person &amp; plate queries fall back to the framework's own tables, so unimported characters and shop-bought cars still show up.</text>
</svg>
