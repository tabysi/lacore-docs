<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 574 V602 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">CITIZEN <tspan fill="#6c8cff">HUB</tspan> — LEGAL AND VEHICLES</text>

  <!-- panel: Legal -->
  <rect x="60" y="90" width="530" height="490" rx="14" fill="#141a26" stroke="#2c3650" stroke-width="2"/>
  <rect x="60" y="90" width="530" height="44" rx="14" fill="#182031"/>
  <text x="80" y="118" fill="#e7ecf5" font-size="15" font-weight="800">Citizen Hub</text>
  <text x="186" y="118" fill="#9fb0ff" font-size="13" font-weight="600">Alex Mercer</text>
  <g font-size="10" font-weight="700" letter-spacing="1">
    <rect x="74" y="146" width="96" height="28" rx="6" fill="#1a2131" stroke="#2c3650"/><text x="122" y="164" text-anchor="middle" fill="#8a96ad">OVERVIEW</text>
    <rect x="176" y="146" width="96" height="28" rx="6" fill="#4a5cff"/><text x="218" y="164" text-anchor="middle" fill="#fff">LEGAL</text><circle cx="250" cy="160" r="4" fill="#ff5a64"/>
    <rect x="278" y="146" width="96" height="28" rx="6" fill="#1a2131" stroke="#2c3650"/><text x="326" y="164" text-anchor="middle" fill="#8a96ad">VEHICLES</text>
    <rect x="380" y="146" width="96" height="28" rx="6" fill="#1a2131" stroke="#2c3650"/><text x="428" y="164" text-anchor="middle" fill="#8a96ad">JOBS</text>
    <rect x="482" y="146" width="96" height="28" rx="6" fill="#1a2131" stroke="#2c3650"/><text x="530" y="164" text-anchor="middle" fill="#8a96ad">ORG</text>
  </g>
  <rect x="74" y="188" width="502" height="52" rx="8" fill="#3a1418" stroke="#e0303a"/>
  <text x="88" y="210" fill="#ff9aa0" font-size="13" font-weight="700">⚠ Active warrant — Failure to appear</text>
  <text x="88" y="229" fill="#ff9aa0" font-size="11">Turn yourself in at a police station, or get a lawyer.</text>
  <text x="74" y="266" fill="#9fb0cc" font-size="10" font-weight="800" letter-spacing="1">CITATIONS &amp; FINES</text>
  <text x="576" y="266" text-anchor="end" fill="#ff8a90" font-size="12">Owed: $850 · 1 overdue</text>

  <rect x="74" y="278" width="502" height="92" rx="8" fill="#1a2131" stroke="#8a6a1e"/>
  <text x="88" y="300" fill="#e7ecf5" font-size="13" font-weight="700">Citation — $350</text>
  <text x="88" y="318" fill="#8a96ad" font-size="11">2026-10-01 · 1-A-12</text>
  <rect x="500" y="288" width="64" height="18" rx="9" fill="#3a2f12" stroke="#c79a2a"/><text x="532" y="301" text-anchor="middle" fill="#f0c060" font-size="9" font-weight="800">UNPAID</text>
  <text x="88" y="352" fill="#8a96ad" font-size="11">Due: 08.10.2026</text>
  <rect x="490" y="334" width="76" height="26" rx="7" fill="#4a5cff"/><text x="528" y="351" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Pay $350</text>

  <rect x="74" y="380" width="502" height="92" rx="8" fill="#1a2131" stroke="#8a6a1e"/>
  <text x="88" y="402" fill="#e7ecf5" font-size="13" font-weight="700">Citation — $500</text>
  <text x="88" y="420" fill="#8a96ad" font-size="11">2026-09-20 · 2-L-30</text>
  <rect x="494" y="390" width="70" height="18" rx="9" fill="#3a1418" stroke="#e0303a"/><text x="529" y="403" text-anchor="middle" fill="#ff9aa0" font-size="9" font-weight="800">OVERDUE</text>
  <text x="88" y="454" fill="#8a96ad" font-size="11">Due: 27.09.2026</text>
  <rect x="456" y="436" width="110" height="26" rx="7" fill="#c0392b"/><text x="511" y="453" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Click to confirm</text>

  <rect x="74" y="482" width="502" height="48" rx="8" fill="#1a2131" stroke="#232c42"/>
  <text x="88" y="504" fill="#e7ecf5" font-size="13" font-weight="700">Arrest Report — $1200 · 10 mo</text>
  <text x="88" y="521" fill="#8a96ad" font-size="11">2026-09-02 · 1-A-12</text>
  <rect x="512" y="497" width="52" height="18" rx="9" fill="#12362a" stroke="#3cd296"/><text x="538" y="510" text-anchor="middle" fill="#3cd296" font-size="9" font-weight="800">PAID</text>
  <text x="74" y="556" fill="#8a96ad" font-size="11">Paying takes two clicks. Nothing is charged by accident.</text>

  <!-- panel: Vehicles -->
  <rect x="620" y="90" width="520" height="490" rx="14" fill="#141a26" stroke="#2c3650" stroke-width="2"/>
  <rect x="620" y="90" width="520" height="44" rx="14" fill="#182031"/>
  <text x="640" y="118" fill="#e7ecf5" font-size="15" font-weight="800">Vehicles</text>

  <rect x="634" y="150" width="492" height="132" rx="8" fill="#1a2131" stroke="#8a6a1e"/>
  <rect x="648" y="164" width="84" height="24" rx="5" fill="#232c42"/><text x="690" y="181" text-anchor="middle" fill="#9fb0ff" font-size="12" font-weight="700" font-family="Consolas, monospace">48VTX291</text>
  <text x="744" y="181" fill="#e7ecf5" font-size="13" font-weight="700">Sultan RS</text><text x="818" y="181" fill="#8a96ad" font-size="12">Blue</text>
  <rect x="952" y="166" width="82" height="18" rx="9" fill="#3a1418" stroke="#e0303a"/><text x="993" y="179" text-anchor="middle" fill="#ff9aa0" font-size="9" font-weight="800">IMPOUNDED</text>
  <rect x="1042" y="166" width="70" height="18" rx="9" fill="#12362a" stroke="#3cd296"/><text x="1077" y="179" text-anchor="middle" fill="#3cd296" font-size="9" font-weight="800">INSURED</text>
  <rect x="648" y="198" width="464" height="26" rx="6" fill="#3a2f12"/>
  <text x="660" y="215" fill="#f0c060" font-size="12">Parked in a red zone · 02.10.2026 · Fee: $500</text>
  <rect x="648" y="238" width="170" height="28" rx="7" fill="#4a5cff"/><text x="733" y="256" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Release from impound</text>
  <rect x="828" y="238" width="124" height="28" rx="7" fill="none" stroke="#3a4668"/><text x="890" y="256" text-anchor="middle" fill="#c9d3ea" font-size="12" font-weight="700">Report stolen</text>

  <rect x="634" y="296" width="492" height="100" rx="8" fill="#1a2131" stroke="#8a6a1e"/>
  <rect x="648" y="310" width="76" height="24" rx="5" fill="#232c42"/><text x="686" y="327" text-anchor="middle" fill="#9fb0ff" font-size="12" font-weight="700" font-family="Consolas, monospace">7ABC123</text>
  <text x="736" y="327" fill="#e7ecf5" font-size="13" font-weight="700">Bison</text><text x="780" y="327" fill="#8a96ad" font-size="12">White</text>
  <rect x="908" y="312" width="118" height="18" rx="9" fill="#3a1418" stroke="#e0303a"/><text x="967" y="325" text-anchor="middle" fill="#ff9aa0" font-size="9" font-weight="800">REPORTED STOLEN</text>
  <rect x="1030" y="312" width="86" height="18" rx="9" fill="#3a2f12" stroke="#c79a2a"/><text x="1073" y="325" text-anchor="middle" fill="#f0c060" font-size="9" font-weight="800">NO INSURANCE</text>
  <rect x="648" y="352" width="70" height="28" rx="7" fill="none" stroke="#3a4668"/><text x="683" y="370" text-anchor="middle" fill="#c9d3ea" font-size="12" font-weight="700">Insure</text>
  <rect x="728" y="352" width="124" height="28" rx="7" fill="none" stroke="#3a4668"/><text x="790" y="370" text-anchor="middle" fill="#c9d3ea" font-size="12" font-weight="700">I have it back</text>
  <rect x="862" y="352" width="150" height="28" rx="7" fill="none" stroke="#3a4668"/><text x="937" y="370" text-anchor="middle" fill="#ff8a90" font-size="12" font-weight="700">Remove registration</text>

  <g font-size="12" fill="#98a6c0">
    <text x="634" y="432">· The owner can only withdraw a stolen report they made themselves.</text>
    <text x="634" y="454">· A flag set by the police is cleared by an officer (person card).</text>
    <text x="634" y="476">· Releasing an impound charges the fee on ESX / QBCore / QBox;</text>
    <text x="646" y="494">on a standalone server it is shown and nothing is charged.</text>
    <text x="634" y="516">· Framework garage vehicles cannot be removed here.</text>
  </g>
</svg>
