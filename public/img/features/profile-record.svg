<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/></marker>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/><rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 504 V532 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">PROFILES — <tspan fill="#6c8cff">THE DIGITAL FILE</tspan></text>

  <!-- Character slots -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="80" y="120" width="150" height="56" rx="10" fill="#0e1220" stroke="#4a5cff" stroke-width="3"/>
    <text x="155" y="145" fill="#e7ecf5">CHARACTER 1</text><text x="155" y="164" fill="#6c8cff" font-size="11">ACTIVE — /char</text>
    <rect x="80" y="192" width="150" height="56" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
    <text x="155" y="217" fill="#9fb0ff">CHARACTER 2</text><text x="155" y="236" fill="#6b7689" font-size="11">own vehicles + records</text>
    <rect x="80" y="264" width="150" height="56" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
    <text x="155" y="289" fill="#9fb0ff">CHARACTER 3</text><text x="155" y="308" fill="#6b7689" font-size="11">own vehicles + records</text>
  </g>
  <line x1="230" y1="148" x2="332" y2="230" stroke="#2c3650" stroke-width="2" marker-end="url(#arr)"/>
  <text x="248" y="176" fill="#6b7689" font-size="12" font-weight="600">mirrored</text>

  <!-- The file -->
  <rect x="340" y="110" width="380" height="330" rx="12" fill="#0e1220" stroke="#4a5cff" stroke-width="3"/>
  <text x="530" y="142" fill="#e7ecf5" font-size="18" font-weight="700" text-anchor="middle">/profile — DIGITAL FILE</text>
  <g font-size="14" font-weight="600" fill="#9fb0ff">
    <text x="368" y="176">IDENTITY — name · DOB · description</text>
    <text x="368" y="204">LICENCES — driver / CCW / pilot / …</text>
    <text x="368" y="232">VEHICLES — self-registered plates</text>
    <text x="368" y="260">RECORDS — reports · evidence · charges</text>
    <text x="368" y="288" fill="#ff7b6b">WARRANT — active flag + reason</text>
    <text x="368" y="316">EMOTE RADIAL — civilian layout</text>
  </g>
  <rect x="368" y="336" width="324" height="30" rx="6" fill="#101a10" stroke="#2fae2f"/>
  <text x="530" y="356" fill="#7dff7d" font-size="12" font-weight="700" text-anchor="middle">ACHIEVEMENTS / XP — RP-only, no economy</text>
  <rect x="368" y="376" width="324" height="30" rx="6" fill="#0a0d13" stroke="#2c3650"/>
  <text x="530" y="396" fill="#6b7689" font-size="12" font-weight="700" text-anchor="middle">or sourced from ESX / QBCore / QBox (Bridge)</text>

  <!-- Readers -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="880" y="130" width="240" height="52" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="1000" y="162" fill="#e7ecf5">MDT / CAD QUERY</text>
    <rect x="880" y="202" width="240" height="52" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="1000" y="234" fill="#e7ecf5">CCTV SCANNER</text>
    <rect x="880" y="274" width="240" height="52" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="1000" y="306" fill="#e7ecf5">DIGITAL ID CARD</text>
  </g>
  <g stroke="#2c3650" stroke-width="2">
    <line x1="720" y1="200" x2="872" y2="160" marker-end="url(#arr)"/>
    <line x1="720" y1="240" x2="872" y2="230" marker-end="url(#arr)"/>
    <line x1="720" y1="285" x2="872" y2="300" marker-end="url(#arr)"/>
  </g>
  <rect x="880" y="346" width="240" height="60" rx="10" fill="none" stroke="#8a9a2f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1000" y="372" fill="#dcea8a" font-size="13" font-weight="700" text-anchor="middle">VISIBILITY-GATED</text>
  <text x="1000" y="392" fill="#8a9a2f" font-size="12" font-weight="600" text-anchor="middle">owner · staff · same faction</text>

  <text x="60" y="500" fill="#6b7689" font-size="15" font-weight="600">Characters are the source of truth — the active one is mirrored into the civilian record every tool reads. Private entries never reach unauthorised clients.</text>
</svg>
