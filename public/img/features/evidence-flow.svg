<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/></marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/><rect width="1200" height="520" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 464 V492 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">EVIDENCE &amp; REPORTS — <tspan fill="#6c8cff">FROM MDT TO RECORD</tspan></text>

  <!-- Officer files -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="70" y="140" width="250" height="120" rx="12" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
    <text x="195" y="170" fill="#e7ecf5">OFFICER IN THE MDT</text>
    <text x="195" y="196" fill="#9fb0ff" font-size="12">files a report — type + narrative</text>
    <text x="195" y="216" fill="#9fb0ff" font-size="12">logs evidence — type + description</text>
    <text x="195" y="240" fill="#6b7689" font-size="11">types from cfg-evidence-sh.lua</text>
  </g>
  <line x1="320" y1="200" x2="430" y2="200" stroke="#2c3650" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Record store -->
  <rect x="440" y="120" width="320" height="180" rx="12" fill="#0e1220" stroke="#4a5cff" stroke-width="3"/>
  <text x="600" y="150" fill="#e7ecf5" font-size="16" font-weight="700" text-anchor="middle">SUBJECT'S RECORD</text>
  <g font-size="13" font-weight="600" fill="#9fb0ff">
    <text x="466" y="180">Arrest Report — filing officer + date</text>
    <text x="466" y="204" fill="#dcea8a">EV260706-a3f1 — 🔫 Weapon</text>
    <text x="466" y="228" fill="#dcea8a">EV260706-b2c4 — 🧬 DNA Sample</text>
    <text x="466" y="252">…alongside charges, citations, warrant</text>
  </g>
  <text x="600" y="284" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">evidence tags: EV&lt;YYMMDD&gt;-&lt;hex&gt; · optional custody chain</text>
  <line x1="760" y1="200" x2="860" y2="200" stroke="#2c3650" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Visibility gate -->
  <rect x="870" y="110" width="260" height="200" rx="12" fill="#0b0f0a" stroke="#8a9a2f" stroke-width="3"/>
  <text x="1000" y="140" fill="#dcea8a" font-size="15" font-weight="700" text-anchor="middle">VISIBILITY GATE</text>
  <text x="1000" y="158" fill="#8a9a2f" font-size="11" font-weight="600" text-anchor="middle">server-side · RecordsVisibleTo</text>
  <g font-size="13" font-weight="600">
    <text x="892" y="188" fill="#e7ecf5">OWNER → own entries</text>
    <text x="892" y="216" fill="#e7ecf5">STAFF → all entries</text>
    <text x="892" y="244" fill="#e7ecf5">FACTION → faction-visible</text>
    <text x="892" y="278" fill="#ff7b6b">PRIVATE → never sent</text>
  </g>

  <!-- Where it surfaces -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="440" y="360" width="200" height="46" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="540" y="389" fill="#e7ecf5">MDT QUERY</text>
    <rect x="660" y="360" width="200" height="46" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="760" y="389" fill="#e7ecf5">PERSON CARD</text>
    <rect x="880" y="360" width="200" height="46" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/><text x="980" y="389" fill="#e7ecf5">CCTV SCANNER</text>
  </g>
  <g stroke="#2c3650" stroke-width="2">
    <line x1="560" y1="300" x2="540" y2="352" marker-end="url(#arr)"/>
    <line x1="640" y1="300" x2="740" y2="352" marker-end="url(#arr)"/>
    <line x1="1000" y1="310" x2="985" y2="352" marker-end="url(#arr)"/>
  </g>

  <text x="60" y="470" fill="#6b7689" font-size="15" font-weight="600">Reports and evidence land in the same record store as charges, citations and warrants — and every surface honours the gate.</text>
</svg>
