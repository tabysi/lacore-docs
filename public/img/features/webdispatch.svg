<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a9a2f"/></marker>
  </defs>
  <rect width="1200" height="540" fill="url(#bg)"/><rect width="1200" height="540" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 484 V512 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">WEB DISPATCHER — <tspan fill="#6c8cff">HOSTED PORTAL</tspan></text>

  <!-- FiveM server -->
  <rect x="70" y="140" width="280" height="170" rx="12" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
  <text x="210" y="172" fill="#e7ecf5" font-size="16" font-weight="700" text-anchor="middle">YOUR FIVEM SERVER</text>
  <g font-size="12" font-weight="600" fill="#9fb0ff">
    <text x="94" y="200">setr lacore_license_key "…"</text>
    <text x="94" y="222">setr lacore_webdispatch "true"</text>
  </g>
  <rect x="94" y="240" width="232" height="26" rx="6" fill="#0b0f0a" stroke="#8a9a2f"/>
  <text x="210" y="258" fill="#dcea8a" font-size="11" font-weight="700" text-anchor="middle">Discord role check runs HERE — token never leaves</text>
  <text x="210" y="292" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">nothing listens on your server · off by default</text>

  <!-- Relay -->
  <line x1="350" y1="200" x2="470" y2="200" stroke="#4a5cff" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="410" y="188" fill="#9fb0ff" font-size="12" font-weight="700" text-anchor="middle">push every 2 s</text>
  <line x1="470" y1="250" x2="350" y2="250" stroke="#8a9a2f" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="410" y="272" fill="#dcea8a" font-size="12" font-weight="700" text-anchor="middle">actions ride back</text>

  <rect x="480" y="150" width="240" height="150" rx="12" fill="#0e1220" stroke="#4a5cff" stroke-width="3"/>
  <text x="600" y="182" fill="#e7ecf5" font-size="16" font-weight="700" text-anchor="middle">lacore.netica.dev</text>
  <text x="600" y="206" fill="#9fb0ff" font-size="12" font-weight="600" text-anchor="middle">holds the latest snapshot</text>
  <text x="600" y="226" fill="#9fb0ff" font-size="12" font-weight="600" text-anchor="middle">queues dispatcher actions</text>
  <text x="600" y="254" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">every action audited in Big Brother</text>
  <text x="600" y="272" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">as source “web” with Discord identity</text>

  <!-- Browser -->
  <line x1="720" y1="225" x2="820" y2="225" stroke="#2c3650" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="830" y="120" width="300" height="210" rx="12" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
  <text x="980" y="150" fill="#e7ecf5" font-size="15" font-weight="700" text-anchor="middle">/server/&lt;id&gt; — BROWSER</text>
  <g font-size="12" font-weight="600" fill="#9fb0ff" text-anchor="middle">
    <text x="980" y="176">Dispatch · Map · Units · Radio windows</text>
    <text x="980" y="196">game-atlas map tiles, same calibration</text>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="854" y="212" width="70" height="24" rx="5" fill="#101a10" stroke="#2fae2f"/><text x="889" y="229" fill="#7dff7d">LIVE</text>
    <rect x="932" y="212" width="70" height="24" rx="5" fill="#1a1610" stroke="#d08a2a"/><text x="967" y="229" fill="#ffd9a0">STALE</text>
    <rect x="1010" y="212" width="96" height="24" rx="5" fill="#16090b" stroke="#d04a4a"/><text x="1058" y="229" fill="#ffb0b0">OFFLINE</text>
    <rect x="854" y="244" width="110" height="24" rx="5" fill="#0e1220" stroke="#4a5cff"/><text x="909" y="261" fill="#9fb0ff">READ ONLY</text>
    <rect x="972" y="244" width="134" height="24" rx="5" fill="#0a0d13" stroke="#2c3650"/><text x="1039" y="261" fill="#6b7689">NO ACCESS</text>
  </g>
  <text x="980" y="296" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">dashboard team (servers scope) — or a Discord</text>
  <text x="980" y="312" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">role you name in WebDispatchAccess</text>

  <!-- Self-hosted alternative -->
  <rect x="70" y="370" width="1060" height="84" rx="12" fill="none" stroke="#2c3650" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="94" y="400" fill="#9fb0ff" font-size="14" font-weight="700">ALTERNATIVE: SELF-HOSTED BRIDGE</text>
  <text x="94" y="424" fill="#6b7689" font-size="13" font-weight="600">lacore_bridge_url + lacore_bridge_token → your own Node bridge → WebSocket to your web app. Both paths can run at the same time.</text>

  <text x="60" y="500" fill="#6b7689" font-size="15" font-weight="600">The portal never pretends to be live — snapshots older than 10 s dim the windows and hold actions; read-only verdicts are enforced server-side too.</text>
</svg>
