<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Chakra Petch', 'Segoe UI', system-ui">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1a2130" stroke-width="1"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b28"/>
      <stop offset="1" stop-color="#0d1119"/>
    </linearGradient>
  </defs>

  <rect width="900" height="380" fill="url(#bg)"/>
  <rect width="900" height="380" fill="url(#grid)"/>

  <text x="40" y="46" fill="#9fb0ff" font-size="15" letter-spacing="2">REQUEST DETAILS — BEFORE / AFTER</text>

  <!-- before -->
  <text x="40" y="86" fill="#6d7a92" font-size="14">Before — one line, 120 characters</text>
  <rect x="40" y="100" width="330" height="120" rx="10" fill="url(#card)" stroke="#232c3e"/>
  <circle cx="68" cy="128" r="13" fill="#4a5cff"/>
  <text x="68" y="133" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">?</text>
  <text x="90" y="133" fill="#e7ecf5" font-size="14" font-weight="700">Request details</text>
  <rect x="56" y="150" width="298" height="28" rx="6" fill="#05070b" stroke="#34405a"/>
  <text x="66" y="169" fill="#6d7a92" font-size="12">Details (optional)</text>
  <rect x="248" y="188" width="50" height="20" rx="5" fill="#232a38" stroke="#34405a"/>
  <text x="273" y="202" fill="#e7ecf5" font-size="11" text-anchor="middle">Cancel</text>
  <rect x="304" y="188" width="50" height="20" rx="5" fill="#4a5cff"/>
  <text x="329" y="202" fill="#fff" font-size="11" text-anchor="middle">Send</text>

  <!-- arrow -->
  <path d="M392 160h40" stroke="#4a5cff" stroke-width="2"/>
  <path d="M432 160l-9-5v10z" fill="#4a5cff"/>

  <!-- after -->
  <text x="456" y="86" fill="#9fb0ff" font-size="14">Now — four lines, 500 characters, resizable</text>
  <rect x="456" y="100" width="404" height="216" rx="10" fill="url(#card)" stroke="#2f3c58"/>
  <circle cx="484" cy="128" r="13" fill="#6c8cff"/>
  <text x="484" y="133" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">?</text>
  <text x="506" y="133" fill="#e7ecf5" font-size="14" font-weight="700">Request details</text>
  <rect x="472" y="150" width="372" height="96" rx="6" fill="#05070b" stroke="#6c8cff"/>
  <text x="484" y="172" fill="#e7ecf5" font-size="12">Two suspects, northbound on foot</text>
  <text x="484" y="192" fill="#e7ecf5" font-size="12">One armed — long gun</text>
  <text x="484" y="212" fill="#e7ecf5" font-size="12">Air unit requested</text>
  <path d="M832 238l6-6M826 238l12-12" stroke="#3d4a66" stroke-width="2"/>
  <text x="472" y="266" fill="#6d7a92" font-size="11">Enter = new line · Ctrl+Enter = confirm</text>
  <rect x="722" y="278" width="56" height="24" rx="5" fill="#232a38" stroke="#34405a"/>
  <text x="750" y="294" fill="#e7ecf5" font-size="11" text-anchor="middle">Cancel</text>
  <rect x="788" y="278" width="56" height="24" rx="5" fill="#6c8cff"/>
  <text x="816" y="294" fill="#fff" font-size="11" text-anchor="middle">Send</text>

  <text x="40" y="352" fill="#6d7a92" font-size="12">Same dialog everywhere it is used — backup requests, resolve reasons, every prompt in the CAD.</text>
</svg>
