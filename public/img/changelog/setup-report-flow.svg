<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 464 V492 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">THE <tspan fill="#6c8cff">SETUP REPORT</tspan> — sent when it changes, not on a clock</text>

  <!-- Step 1 -->
  <rect x="60" y="110" width="250" height="150" rx="8" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="82" y="142" fill="#9fb0ff" font-size="14" font-weight="700" letter-spacing="2">1 · LOOK</text>
  <text x="82" y="172" fill="#e7ecf5" font-size="13">framework</text>
  <text x="82" y="196" fill="#e7ecf5" font-size="13">resource listing</text>
  <text x="82" y="220" fill="#e7ecf5" font-size="13">overlaps</text>
  <text x="82" y="246" fill="#7d8798" font-size="12">from LacoreDetect</text>

  <!-- Step 2 -->
  <rect x="350" y="110" width="250" height="150" rx="8" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="372" y="142" fill="#9fb0ff" font-size="14" font-weight="700" letter-spacing="2">2 · FINGERPRINT</text>
  <text x="372" y="176" fill="#e7ecf5" font-size="13">same as last time?</text>
  <text x="372" y="212" fill="#7d8798" font-size="13">yes → send nothing</text>
  <text x="372" y="238" fill="#6c8cff" font-size="13">no → send</text>

  <!-- Step 3 -->
  <rect x="640" y="110" width="250" height="150" rx="8" fill="#05070b" stroke="#4a5cff" stroke-width="2"/>
  <text x="662" y="142" fill="#9fb0ff" font-size="14" font-weight="700" letter-spacing="2">3 · RELAY</text>
  <text x="662" y="176" fill="#e7ecf5" font-size="13">/ingest/setup</text>
  <text x="662" y="200" fill="#e7ecf5" font-size="13">write-only, token-gated</text>
  <text x="662" y="238" fill="#7d8798" font-size="12">no DB host in the resource</text>

  <!-- Step 4 -->
  <rect x="930" y="110" width="210" height="150" rx="8" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="952" y="142" fill="#9fb0ff" font-size="14" font-weight="700" letter-spacing="2">4 · THE ROW</text>
  <text x="952" y="176" fill="#e7ecf5" font-size="13">one per server</text>
  <text x="952" y="200" fill="#e7ecf5" font-size="13">overwritten, not</text>
  <text x="952" y="222" fill="#e7ecf5" font-size="13">accumulated</text>

  <line x1="312" y1="185" x2="344" y2="185" stroke="#4a5cff" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="602" y1="185" x2="634" y2="185" stroke="#4a5cff" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="892" y1="185" x2="924" y2="185" stroke="#4a5cff" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Cadence -->
  <rect x="60" y="300" width="1080" height="76" rx="8" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="84" y="330" fill="#9fb0ff" font-size="14" font-weight="700" letter-spacing="2">ON A STABLE SERVER: ROUGHLY ONE REPORT A DAY</text>
  <text x="84" y="356" fill="#7d8798" font-size="13">Checked on the telemetry heartbeat, sent only when the fingerprint moves — plus one forced refresh every 24 hours so a row never goes stale.</text>

  <text x="60" y="424" fill="#e7ecf5" font-size="14" font-weight="700" letter-spacing="2">NO PLAYER DATA · NO FILE CONTENTS · NO CONVARS · NO DATABASE</text>
  <text x="60" y="452" fill="#7d8798" font-size="13">A resource listing is names, states and manifest versions — the same thing a player's own console shows them when they connect.</text>
</svg>
