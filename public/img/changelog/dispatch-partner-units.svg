<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="'Chakra Petch','Segoe UI',system-ui">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4a5cff" stroke-opacity=".08"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6c8cff"/>
    </marker>
  </defs>

  <rect width="1000" height="460" fill="url(#bg)"/>
  <rect width="1000" height="460" fill="url(#grid)"/>

  <text x="40" y="52" fill="#e7ecf5" font-size="26" font-weight="700">Web dispatcher — partners are one unit</text>
  <text x="40" y="78" fill="#9fb0ff" font-size="15">Two officers sharing a callsign used to blank the whole Units list. Now they share a row.</text>

  <!-- left: what the game sends -->
  <rect x="40" y="110" width="360" height="300" rx="8" fill="#111827" stroke="#4a5cff" stroke-opacity=".35"/>
  <text x="56" y="136" fill="#9fb0ff" font-size="13" letter-spacing="1">SNAPSHOT FROM THE GAME</text>
  <rect x="56" y="152" width="328" height="34" rx="4" fill="#1a2233"/>
  <text x="68" y="174" fill="#e7ecf5" font-size="14">1A-12   P. Reyes      ENROUTE</text>
  <rect x="56" y="194" width="328" height="34" rx="4" fill="#2a1a1f" stroke="#ff6b6b" stroke-opacity=".7"/>
  <text x="68" y="216" fill="#ffc9c9" font-size="14">1A-12   K. Okonkwo    ENROUTE</text>
  <rect x="56" y="236" width="328" height="34" rx="4" fill="#1a2233"/>
  <text x="68" y="258" fill="#e7ecf5" font-size="14">2S-04   J. Whitaker   ON SCENE</text>
  <rect x="56" y="278" width="328" height="34" rx="4" fill="#1a2233"/>
  <text x="68" y="300" fill="#e7ecf5" font-size="14">M-3     H. Lindqvist  CLEAR</text>
  <text x="56" y="348" fill="#ff9a9a" font-size="13">Before: same callsign twice = duplicate</text>
  <text x="56" y="368" fill="#ff9a9a" font-size="13">row key, the list stopped rendering.</text>

  <path d="M400 230 H 470" stroke="#6c8cff" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- right: what the Units program shows -->
  <rect x="480" y="110" width="480" height="300" rx="8" fill="#141a2b" stroke="#6c8cff" stroke-opacity=".6"/>
  <text x="496" y="136" fill="#9fb0ff" font-size="13" letter-spacing="1">UNITS PROGRAM</text>
  <text x="496" y="166" fill="#6c8cff" font-size="13" font-weight="700">LAW ENFORCEMENT  2</text>
  <rect x="496" y="176" width="448" height="34" rx="4" fill="#22305a" stroke="#6c8cff"/>
  <text x="508" y="198" fill="#e7ecf5" font-size="14" font-weight="700">1A-12   P. Reyes, K. Okonkwo   ENROUTE</text>
  <rect x="496" y="218" width="448" height="34" rx="4" fill="#1a2233"/>
  <text x="508" y="240" fill="#e7ecf5" font-size="14">2S-04   J. Whitaker   ON SCENE</text>
  <text x="496" y="278" fill="#6c8cff" font-size="13" font-weight="700">FIRE / EMS  1</text>
  <rect x="496" y="288" width="448" height="34" rx="4" fill="#1d2c22" stroke="#4ad38a"/>
  <text x="508" y="310" fill="#bff0d4" font-size="14">M-3     H. Lindqvist  CLEAR</text>
  <text x="496" y="356" fill="#bff0d4" font-size="13">AMR units now also appear under Fire / EMS in the</text>
  <text x="496" y="376" fill="#bff0d4" font-size="13">in-game dispatch console, and /dispatch on accepts them.</text>
</svg>
