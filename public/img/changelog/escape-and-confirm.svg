<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6c8cff"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect width="1200" height="620" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 564 V592 H1144"/>
  </g>

  <text x="60" y="64" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">ESCAPE — <tspan fill="#6c8cff">ONE RULE</tspan> IN EVERY WINDOW</text>
  <text x="60" y="94" fill="#9fb0ff" font-size="16">MDT, dispatch, Agency, Penn, LASD, supervisor, profile, phone</text>

  <!-- Step 1: typing -->
  <rect x="60" y="130" width="300" height="170" rx="8" fill="#0b1019" stroke="#2c3650" stroke-width="2"/>
  <text x="80" y="160" fill="#9fb0ff" font-size="14" letter-spacing="2">1 · TYPING</text>
  <rect x="80" y="178" width="260" height="44" rx="4" fill="#05070b" stroke="#6c8cff" stroke-width="2"/>
  <text x="94" y="206" fill="#e7ecf5" font-size="16">Suspect fled north on Ve</text>
  <rect x="300" y="190" width="2" height="22" fill="#6c8cff"/>
  <text x="80" y="262" fill="#9fb0ff" font-size="14">A field has the focus.</text>
  <text x="80" y="284" fill="#9fb0ff" font-size="14">The draft is only in the window.</text>

  <!-- arrow 1 -->
  <line x1="368" y1="215" x2="452" y2="215" stroke="#6c8cff" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="382" y="170" width="56" height="30" rx="4" fill="#4a5cff"/>
  <text x="410" y="191" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">ESC</text>

  <!-- Step 2: field left -->
  <rect x="460" y="130" width="300" height="170" rx="8" fill="#0b1019" stroke="#2c3650" stroke-width="2"/>
  <text x="480" y="160" fill="#9fb0ff" font-size="14" letter-spacing="2">2 · FIELD LEFT</text>
  <rect x="480" y="178" width="260" height="44" rx="4" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="494" y="206" fill="#e7ecf5" font-size="16">Suspect fled north on Ve</text>
  <text x="480" y="262" fill="#9fb0ff" font-size="14">The window stays open,</text>
  <text x="480" y="284" fill="#9fb0ff" font-size="14">the text is still there.</text>

  <!-- arrow 2 -->
  <line x1="768" y1="215" x2="852" y2="215" stroke="#6c8cff" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="782" y="170" width="56" height="30" rx="4" fill="#4a5cff"/>
  <text x="810" y="191" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">ESC</text>

  <!-- Step 3: closed -->
  <rect x="860" y="130" width="280" height="170" rx="8" fill="#0b1019" stroke="#2c3650" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="880" y="160" fill="#9fb0ff" font-size="14" letter-spacing="2">3 · CLOSED</text>
  <text x="880" y="206" fill="#e7ecf5" font-size="18" font-weight="700">Window closes</text>
  <text x="880" y="262" fill="#9fb0ff" font-size="14">LASD MDC / PCMS now closes</text>
  <text x="880" y="284" fill="#9fb0ff" font-size="14">on Escape too.</text>

  <!-- Confirm dialog -->
  <text x="60" y="360" fill="#e7ecf5" font-size="20" font-weight="700" letter-spacing="3">PERMANENT ACTIONS <tspan fill="#6c8cff">ASK FIRST</tspan></text>
  <text x="60" y="388" fill="#9fb0ff" font-size="15">Delete character, record or relationship · kick, leave, disband an organisation · resolve in the Agency MDT</text>

  <rect x="60" y="412" width="560" height="160" rx="10" fill="#10141c" stroke="#2c3650" stroke-width="2"/>
  <circle cx="98" cy="452" r="16" fill="#ff5a74"/>
  <text x="98" y="459" fill="#10141c" font-size="20" font-weight="700" text-anchor="middle">!</text>
  <text x="128" y="459" fill="#e7ecf5" font-size="20" font-weight="700">Delete character?</text>
  <text x="84" y="496" fill="#9fb0ff" font-size="15">Jane Roe is deleted for good, with their records,</text>
  <text x="84" y="518" fill="#9fb0ff" font-size="15">vehicles and relationships.</text>
  <rect x="384" y="530" width="104" height="30" rx="4" fill="#151a24" stroke="#2c3650"/>
  <text x="436" y="550" fill="#e7ecf5" font-size="15" text-anchor="middle">Cancel</text>
  <rect x="498" y="530" width="104" height="30" rx="4" fill="#c8203a"/>
  <text x="550" y="550" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Delete</text>

  <!-- side notes -->
  <g font-size="15">
    <text x="680" y="440" fill="#e7ecf5" font-weight="700">Also in this pass</text>
    <text x="680" y="472" fill="#9fb0ff">· Closing the phone gives the keyboard back</text>
    <text x="680" y="498" fill="#9fb0ff">· Org updates no longer pop the panel open</text>
    <text x="680" y="524" fill="#9fb0ff">· X no longer uncuffs the nearest suspect</text>
    <text x="680" y="550" fill="#9fb0ff">· Scaled windows keep their title bar on screen</text>
  </g>
</svg>
