    <path d="M1172 604 V632 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">CUSTOMER <tspan fill="#6c8cff">PORTAL</tspan> — OVERVIEW</text>

  <!-- Window frame -->
  <rect x="60" y="84" width="1080" height="500" rx="8" fill="#0a0b0e" stroke="#2c3650" stroke-width="2"/>

  <!-- Header bar -->
  <rect x="61" y="85" width="1078" height="40" fill="#101218"/>
  <line x1="61" y1="125" x2="1139" y2="125" stroke="#262a34"/>
  <rect x="78" y="97" width="16" height="16" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/>
  <text x="102" y="110" fill="#e7ecf5" font-size="12" font-weight="700" letter-spacing="2">LACORE</text>
  <!-- customer / admin switch -->
  <rect x="820" y="93" width="150" height="24" rx="6" fill="#14161d" stroke="#313644"/>
  <rect x="823" y="96" width="72" height="18" rx="5" fill="#6366f1" fill-opacity="0.25" stroke="#6366f1" stroke-opacity="0.5"/>
