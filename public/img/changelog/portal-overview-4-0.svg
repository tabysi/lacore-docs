  <text x="256" y="470" fill="#9fb0ff" font-size="10">every tile links to the page behind its number</text>

  <!-- Latest build card -->
  <rect x="256" y="486" width="520" height="80" rx="10" fill="#14161d" stroke="#262a34"/>
