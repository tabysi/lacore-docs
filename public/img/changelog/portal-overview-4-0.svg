  <text x="1106" y="218" fill="#828a96" font-size="9" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace">3 / 4</text>
  <g font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace">
    <circle cx="822" cy="244" r="7" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="822" y="247" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">✓</text>
    <text x="838" y="248" fill="#828a96" text-decoration="line-through">Create a license key</text>
    <line x1="812" y1="260" x2="1106" y2="260" stroke="#1c1f27"/>
    <circle cx="822" cy="276" r="7" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="822" y="279" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">✓</text>
    <text x="838" y="280" fill="#828a96" text-decoration="line-through">Link a server</text>
    <line x1="812" y1="292" x2="1106" y2="292" stroke="#1c1f27"/>
    <circle cx="822" cy="308" r="7" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="822" y="311" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">✓</text>
    <text x="838" y="312" fill="#828a96" text-decoration="line-through">Server reporting online</text>
    <line x1="812" y1="324" x2="1106" y2="324" stroke="#1c1f27"/>
    <circle cx="822" cy="340" r="7" fill="#191c24" stroke="#313644"/>
    <text x="838" y="344" fill="#e7ecf5">Running the latest release</text>
    <text x="838" y="356" fill="#828a96" font-size="8">v4.0.0 is out — update through Keymaster.</text>
  </g>

  <!-- Rail: what's new -->
  <rect x="796" y="382" width="326" height="88" rx="10" fill="#14161d" stroke="#262a34"/>
  <text x="812" y="404" fill="#ffffff" font-size="12" font-weight="700">What's new</text>
  <text x="812" y="428" fill="#ffffff" font-size="14" font-weight="700">4.0.0</text>
  <text x="856" y="428" fill="#9aa0ad" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">LACORE 4.0</text>
  <text x="812" y="446" fill="#e7ecf5" font-size="9">911 from the web dispatcher, MDT import + evidence, warrant queue…</text>
  <text x="812" y="462" fill="#8b8ef5" font-size="8" font-weight="700" letter-spacing="1">VIEW ALL UPDATES →</text>

  <!-- Rail: IP check -->
  <rect x="796" y="486" width="326" height="80" rx="10" fill="#14161d" stroke="#262a34"/>
  <text x="812" y="506" fill="#828a96" font-size="8" letter-spacing="1.5" font-family="'JetBrains Mono', ui-monospace, monospace">SERVER IP CHECK</text>
  <rect x="812" y="516" width="220" height="22" rx="5" fill="#191c24" stroke="#262a34"/>
  <text x="822" y="531" fill="#5f6672" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">123.45.67.89</text>
  <rect x="1040" y="516" width="66" height="22" rx="5" fill="#191c24" stroke="#313644"/>
  <text x="1073" y="531" fill="#9aa0ad" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">CHECK</text>
  <text x="812" y="556" fill="#828a96" font-size="8">Check whether a server IP is blocked on the network.</text>

  <!-- Callouts -->
  <g font-size="11" fill="#9fb0ff">
    <text x="796" y="188" text-anchor="start">setup checklist — read from the same data as the tiles</text>
  </g>
  <text x="60" y="622" fill="#9fb0ff" font-size="13">Six linked tiles instead of seven dead ones · setup checklist in the rail · IP check moved out of the product card</text>
</svg>
