  <text x="272" y="524" fill="#9aa0ad" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace">LACORE v4.0.0 · lifetime updates · delivered via Tebex &amp; Keymaster</text>
  <rect x="272" y="536" width="300" height="20" rx="5" fill="#6366f1"/>
  <text x="422" y="549" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">↓ GET LACORE</text>
  <rect x="580" y="536" width="80" height="20" rx="5" fill="#191c24" stroke="#313644"/>
  <text x="620" y="549" fill="#9aa0ad" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">VERSIONS</text>
  <rect x="668" y="536" width="60" height="20" rx="5" fill="#191c24" stroke="#313644"/>
  <text x="698" y="549" fill="#9aa0ad" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">SETUP</text>

