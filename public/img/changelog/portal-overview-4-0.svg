    </g>
    <g transform="translate(445 370)">
      <text fill="#828a96" font-size="8" letter-spacing="1.5">LICENSE KEYS</text>
      <text y="26" fill="#e7ecf5" font-size="18" font-weight="600" font-family="'Chakra Petch', 'Segoe UI', system-ui, sans-serif">2</text>
      <text y="42" fill="#828a96" font-size="8">active</text>
    </g>
    <g transform="translate(619 370)">
      <text fill="#828a96" font-size="8" letter-spacing="1.5">SUPPORT</text>
      <text y="26" fill="#e7ecf5" font-size="18" font-weight="600" font-family="'Chakra Petch', 'Segoe UI', system-ui, sans-serif">0</text>
      <text y="42" fill="#828a96" font-size="8">open · 3 total</text>
    </g>
