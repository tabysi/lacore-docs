  <rect x="256" y="196" width="520" height="250" rx="10" fill="#14161d" stroke="#262a34"/>
  <rect x="272" y="210" width="30" height="30" rx="8" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1"/>
  <text x="287" y="230" fill="#6366f1" font-size="11" font-weight="700" text-anchor="middle">{ }</text>
  <text x="312" y="224" fill="#ffffff" font-size="13" font-weight="600">LACORE — Core Framework</text>
  <text x="312" y="238" fill="#828a96" font-size="8">Tebex order · single-server IP-lock</text>
  <rect x="640" y="214" width="120" height="20" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.3"/>
  <text x="700" y="227" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">v4.0.0 · UP TO DATE</text>
  <line x1="256" y1="254" x2="776" y2="254" stroke="#262a34"/>

