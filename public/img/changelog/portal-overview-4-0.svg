  <line x1="231" y1="126" x2="231" y2="583" stroke="#262a34"/>
  <text x="78" y="148" fill="#828a96" font-size="8" letter-spacing="2">// YOUR ACCOUNT</text>
  <g font-size="10" fill="#9aa0ad">
    <rect x="72" y="156" width="150" height="20" rx="6" fill="#6366f1" fill-opacity="0.16"/>
    <text x="84" y="170" fill="#e7ecf5">Overview</text>
    <text x="84" y="192">Servers</text>
    <text x="84" y="214">License keys</text>
    <text x="84" y="236">Config</text>
    <text x="84" y="258">Dispatch</text>
    <text x="84" y="280">Community</text>
    <text x="84" y="302">Downloads</text>
    <text x="84" y="324">Payments</text>
    <text x="84" y="346">Players</text>
    <text x="84" y="368">Anticheat</text>
    <text x="84" y="390">Bug Reports</text>
    <text x="84" y="412">Team</text>
    <text x="84" y="434">Activity log</text>
    <text x="84" y="456">Support</text>
