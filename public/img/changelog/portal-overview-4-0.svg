  <text x="932" y="109" fill="#828a96" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">ADMIN</text>
  <rect x="982" y="93" width="112" height="24" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/>
  <circle cx="996" cy="105" r="3" fill="#34d399"/>
  <text x="1006" y="109" fill="#34d399" font-size="9" font-weight="700" letter-spacing="1">LICENSE ACTIVE</text>

