<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 504 V532 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">THE <tspan fill="#6c8cff">SETUP REVIEW</tspan> — it tells you, it does not do it</text>

  <!-- Console -->
  <rect x="60" y="100" width="620" height="330" rx="8" fill="#05070b" stroke="#4a5cff" stroke-width="2"/>
  <g font-family="'Consolas', 'Courier New', monospace" font-size="13">
    <text x="82" y="132" fill="#4ade80">[lacore:autoconfig] Setup review — framework: esx</text>
    <text x="82" y="154" fill="#9fb0ff">Nothing below has been changed. These are suggestions.</text>
    <text x="82" y="190" fill="#e7ecf5">Settings that may suit this server better (2):</text>
    <text x="82" y="214" fill="#ffb454">  features.cad.dispatch = false</text>
    <text x="82" y="234" fill="#7d8798">     ps-dispatch already runs a dispatch console —</text>
    <text x="82" y="252" fill="#7d8798">     two of them means every call arrives twice.</text>
    <text x="82" y="278" fill="#ffb454">  features.phone = false</text>
    <text x="82" y="298" fill="#7d8798">     lb-phone is running — LACORE's own phone would</text>
    <text x="82" y="316" fill="#7d8798">     be a second one on the same key.</text>
    <text x="82" y="352" fill="#e7ecf5">Worth knowing — no setting fixes these (1):</text>
    <text x="82" y="376" fill="#ffb454">  Second anticheat detected: FiveGuard</text>
    <text x="82" y="406" fill="#9fb0ff">Re-run any time with /lacore autoconfig</text>
  </g>

  <!-- Gate -->
  <rect x="730" y="100" width="410" height="196" rx="8" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="754" y="132" fill="#9fb0ff" font-size="15" font-weight="700" letter-spacing="2">EVERY SUGGESTION IS GATED</text>
  <g fill="#e7ecf5" font-size="13.5">
    <text x="754" y="166">must exist in the remote-config allowlist</text>
    <text x="754" y="194">must match that key's declared type</text>
    <text x="754" y="222">must differ from the value already in use</text>
    <text x="754" y="250">sensitive keys are refused outright</text>
  </g>
  <text x="754" y="278" fill="#7d8798" font-size="12.5">A rule cannot invent a setting. Nor can an AI.</text>

  <!-- Not applied -->
  <rect x="730" y="322" width="410" height="108" rx="8" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="754" y="354" fill="#7d8798" font-size="15" font-weight="700" letter-spacing="2">WHAT IT NEVER DOES</text>
  <text x="754" y="386" fill="#7d8798" font-size="13.5">✕  write a config file</text>
  <text x="754" y="412" fill="#7d8798" font-size="13.5">✕  apply a single one of its own suggestions</text>

  <line x1="688" y1="200" x2="722" y2="200" stroke="#4a5cff" stroke-width="2" marker-end="url(#a3)"/>

  <text x="60" y="474" fill="#e7ecf5" font-size="14" font-weight="700" letter-spacing="2">EVERY LINE SAYS WHY, AND NAMES THE RESOURCE THAT CAUSED IT</text>
  <text x="60" y="502" fill="#7d8798" font-size="13">A suggestion without a reason is one nobody acts on — acting on it would mean trusting it blindly.</text>
</svg>
