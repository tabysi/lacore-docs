<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="'Chakra Petch','Segoe UI',system-ui">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4a5cff" stroke-opacity=".08"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6c8cff"/>
    </marker>
  </defs>

  <rect width="1000" height="460" fill="url(#bg)"/>
  <rect width="1000" height="460" fill="url(#grid)"/>

  <text x="40" y="52" fill="#e7ecf5" font-size="26" font-weight="700">PennCAD — clearing a call vs. clearing yourself</text>
  <text x="40" y="78" fill="#9fb0ff" font-size="15">F11 now resolves the incident for everyone; SHIFT+F11 detaches only your unit.</text>

  <!-- left: the F-key rail -->
  <rect x="40" y="110" width="230" height="300" rx="8" fill="#111827" stroke="#4a5cff" stroke-opacity=".35"/>
  <text x="56" y="136" fill="#9fb0ff" font-size="13" letter-spacing="1">FUNCTION RAIL</text>
  <rect x="56" y="150" width="198" height="30" rx="4" fill="#1a2233"/>
  <text x="68" y="170" fill="#7f8ba3" font-size="14">F10  Add Comments</text>
  <rect x="56" y="188" width="198" height="34" rx="4" fill="#22305a" stroke="#6c8cff"/>
  <text x="68" y="210" fill="#e7ecf5" font-size="14" font-weight="700">F11  Resolve Incident</text>
  <rect x="56" y="230" width="198" height="34" rx="4" fill="#1d2c22" stroke="#4ad38a"/>
  <text x="68" y="252" fill="#bff0d4" font-size="14" font-weight="700">⇧F11  Detach</text>
  <rect x="56" y="272" width="198" height="30" rx="4" fill="#1a2233"/>
  <text x="68" y="292" fill="#7f8ba3" font-size="14">F12  Day/Night</text>
  <rect x="56" y="352" width="198" height="34" rx="4" fill="#1a2233" stroke="#4a5cff" stroke-opacity=".5"/>
  <text x="68" y="374" fill="#9fb0ff" font-size="14">STATUS ▴  ON SCENE</text>
  <text x="56" y="404" fill="#5d6b86" font-size="12">footer picker — status without the call</text>

  <!-- arrows -->
  <path d="M270 205 H 350" stroke="#6c8cff" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M270 247 H 350" stroke="#4ad38a" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- right: outcomes -->
  <rect x="360" y="150" width="600" height="110" rx="8" fill="#141a2b" stroke="#6c8cff" stroke-opacity=".6"/>
  <text x="382" y="180" fill="#e7ecf5" font-size="17" font-weight="700">Resolve Incident — the whole call closes</text>
  <text x="382" y="205" fill="#9fb0ff" font-size="14">Disposition is filed, the call flips to Resolved on every terminal,</text>
  <text x="382" y="226" fill="#9fb0ff" font-size="14">and it leaves the active call list for all units. The disposition pane</text>
  <text x="382" y="247" fill="#9fb0ff" font-size="14">now says so before you pick a code.</text>

  <rect x="360" y="280" width="600" height="110" rx="8" fill="#12231b" stroke="#4ad38a" stroke-opacity=".6"/>
  <text x="382" y="310" fill="#e7ecf5" font-size="17" font-weight="700">Detach — only your unit goes clear</text>
  <text x="382" y="335" fill="#bff0d4" font-size="14">Your status becomes CLEAR and you drop off the incident. The call</text>
  <text x="382" y="356" fill="#bff0d4" font-size="14">stays open, and every other unit on it keeps working it.</text>
  <text x="382" y="377" fill="#bff0d4" font-size="14">Also reachable from the disposition pane and the status picker.</text>
</svg>
