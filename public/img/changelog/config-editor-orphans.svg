<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6c8cff"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 574 V602 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">CONFIG EDITOR — <tspan fill="#6c8cff">SETTINGS THAT HAD NO SCREEN</tspan></text>
  <text x="60" y="86" fill="#98a6c0" font-size="13">The editor renders by tab. A group that is in no tab is not hard to find — it is unreachable.</text>

  <!-- row 1: Gameplay → Features -->
  <g>
    <rect x="60" y="116" width="220" height="106" rx="10" fill="#1f3f8f" stroke="#4a5cff" stroke-width="2"/>
    <text x="170" y="160" text-anchor="middle" fill="#dbe3ff" font-size="11" letter-spacing="3">TAB</text>
    <text x="170" y="188" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Features</text>
    <path d="M286 169 H326" stroke="#6c8cff" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <rect x="332" y="116" width="808" height="106" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
    <text x="352" y="146" fill="#e7ecf5" font-size="17" font-weight="700">Gameplay</text>
    <text x="352" y="168" fill="#98a6c0" font-size="12">Combat and damage balance. Every multiplier applies to all players equally.</text>
    <g font-size="11" fill="#9fb0ff">
      <rect x="352" y="182" width="140" height="24" rx="6" fill="#0d1220" stroke="#2c3650"/><text x="422" y="198" text-anchor="middle">Weapon damage x</text>
      <rect x="502" y="182" width="130" height="24" rx="6" fill="#0d1220" stroke="#2c3650"/><text x="567" y="198" text-anchor="middle">Melee damage x</text>
      <rect x="642" y="182" width="140" height="24" rx="6" fill="#0d1220" stroke="#2c3650"/><text x="712" y="198" text-anchor="middle">Vehicle damage x</text>
      <rect x="792" y="182" width="140" height="24" rx="6" fill="#0d1220" stroke="#2c3650"/><text x="862" y="198" text-anchor="middle">Weapon defense x</text>
      <rect x="942" y="182" width="150" height="24" rx="6" fill="#0d1220" stroke="#2c3650"/><text x="1017" y="198" text-anchor="middle">Onboarding hints</text>
    </g>
  </g>

  <!-- row 2: Investigation → Modules -->
  <g>
    <rect x="60" y="248" width="220" height="106" rx="10" fill="#1f3f8f" stroke="#4a5cff" stroke-width="2"/>
    <text x="170" y="292" text-anchor="middle" fill="#dbe3ff" font-size="11" letter-spacing="3">TAB</text>
    <text x="170" y="320" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Modules</text>
    <path d="M286 301 H326" stroke="#6c8cff" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <rect x="332" y="248" width="808" height="106" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
    <text x="352" y="278" fill="#e7ecf5" font-size="17" font-weight="700">Investigation</text>
    <text x="352" y="300" fill="#98a6c0" font-size="12">Crime-scene traces: how long the lab takes and how close you must stand to collect.</text>
    <g font-size="11" fill="#9fb0ff">
      <rect x="352" y="314" width="150" height="24" rx="6" fill="#0d1220" stroke="#2c3650"/><text x="427" y="330" text-anchor="middle">Lab time (seconds)</text>
      <rect x="512" y="314" width="170" height="24" rx="6" fill="#0d1220" stroke="#2c3650"/><text x="597" y="330" text-anchor="middle">Collect distance (m)</text>
      <text x="700" y="330" fill="#5d6a86" font-size="11">placed next to Evidence — the two share one locker</text>
    </g>
  </g>

  <!-- row 3: hud.crosshair → HUD -->
  <g>
    <rect x="60" y="380" width="220" height="106" rx="10" fill="#1f3f8f" stroke="#4a5cff" stroke-width="2"/>
    <text x="170" y="424" text-anchor="middle" fill="#dbe3ff" font-size="11" letter-spacing="3">TAB</text>
    <text x="170" y="452" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">HUD &amp; Phone</text>
    <path d="M286 433 H326" stroke="#6c8cff" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <rect x="332" y="380" width="808" height="106" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
    <text x="352" y="410" fill="#e7ecf5" font-size="17" font-weight="700">HUD <tspan fill="#6c8cff" font-family="Consolas, monospace" font-size="14">hud.crosshair</tspan></text>
    <text x="352" y="432" fill="#98a6c0" font-size="12">In the resource allowlist since 3.5.0, never on the website — so only one side could validate it.</text>
    <g font-size="11">
      <rect x="352" y="446" width="150" height="24" rx="6" fill="#0d1220" stroke="#2c3650"/><text x="427" y="462" text-anchor="middle" fill="#9fb0ff">Weapon crosshair</text>
      <text x="520" y="462" fill="#5d6a86">not tied to the HUD master switch — that hides what LACORE draws, never what GTA draws</text>
    </g>
  </g>

  <!-- footer: the guard -->
  <rect x="60" y="512" width="1080" height="76" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="80" y="540" fill="#9fb0ff" font-size="12" letter-spacing="3">THE GUARD</text>
  <g font-size="12" fill="#98a6c0" font-family="Consolas, monospace">
    <text x="80" y="566">tests/configschema.test.mjs</text>
    <text x="290" y="566" fill="#e7ecf5" font-family="'Chakra Petch', 'Segoe UI', system-ui, Arial, sans-serif">every group in a tab &#183; every group described &#183; both allowlists hold the same keys</text>
    <text x="1010" y="566" fill="#6ee7a8" font-family="'Chakra Petch', 'Segoe UI', system-ui, Arial, sans-serif" font-weight="700">79 / 79</text>
  </g>
</svg>
