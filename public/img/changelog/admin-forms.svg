<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c8cff"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/>
  <rect width="1200" height="660" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 604 V632 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">ADMIN <tspan fill="#6c8cff">FORMS</tspan> — BUILD, SHARE, READ</text>

  <!-- ── 1. Builder ───────────────────────────────────────────── -->
  <text x="60" y="108" fill="#9fb0ff" font-size="12" font-weight="700" letter-spacing="3">1 · BUILD  /admin/forms/</text>
  <rect x="60" y="120" width="340" height="470" rx="8" fill="#0a0b0e" stroke="#2c3650" stroke-width="2"/>
  <!-- header card -->
  <rect x="76" y="136" width="276" height="74" rx="6" fill="#14161d" stroke="#262a34"/>
  <rect x="76" y="136" width="276" height="5" rx="2" fill="#6366f1"/>
  <text x="90" y="170" fill="#e7ecf5" font-size="16" font-weight="700">Staff application</text>
  <text x="90" y="192" fill="#828a96" font-size="10">Tell us a little about yourself.</text>
  <!-- open question card -->
  <rect x="76" y="220" width="276" height="176" rx="6" fill="#14161d" stroke="#3a3f74"/>
  <rect x="76" y="220" width="4" height="176" fill="#6366f1"/>
  <rect x="90" y="232" width="130" height="26" rx="4" fill="#191c24"/>
  <text x="98" y="249" fill="#e7ecf5" font-size="10.5">Which department?</text>
  <rect x="226" y="232" width="116" height="26" rx="4" fill="#0a0b0e" stroke="#313644"/>
  <text x="234" y="249" fill="#e7ecf5" font-size="9.5" font-weight="700">◉ Multiple choice</text>
  <g font-size="10.5" fill="#9aa0ad">
    <circle cx="98" cy="280" r="5" fill="none" stroke="#5f6672"/><text x="112" y="284">LSPD</text>
    <circle cx="98" cy="304" r="5" fill="none" stroke="#5f6672"/><text x="112" y="308">BCSO</text>
    <circle cx="98" cy="328" r="5" fill="none" stroke="#5f6672"/><text x="112" y="332">Fire / EMS</text>
  </g>
  <text x="112" y="354" fill="#8b8ef5" font-size="10">Add option  <tspan fill="#828a96">or</tspan>  add “Other”</text>
  <line x1="90" y1="368" x2="340" y2="368" stroke="#262a34"/>
  <text x="250" y="386" fill="#9aa0ad" font-size="9" letter-spacing="1">REQUIRED</text>
  <rect x="310" y="376" width="28" height="14" rx="7" fill="#6366f1"/>
  <circle cx="331" cy="383" r="5" fill="#fff"/>
  <!-- collapsed conditional card -->
  <rect x="76" y="406" width="276" height="62" rx="6" fill="#14161d" stroke="#262a34"/>
  <text x="90" y="430" fill="#e7ecf5" font-size="11.5"><tspan fill="#5f6672">3.</tspan> Why BCSO?</text>
  <text x="90" y="453" fill="#6c8cff" font-size="9.5">⑂ Only if “Which department?” is “BCSO”</text>
  <!-- section card -->
  <text x="80" y="490" fill="#8b8ef5" font-size="8.5" letter-spacing="2">SECTION 2 OF 2</text>
  <rect x="76" y="498" width="276" height="44" rx="6" fill="#191c24" stroke="#262a34"/>
  <text x="90" y="525" fill="#e7ecf5" font-size="12" font-weight="700">Experience</text>
  <!-- toolbar -->
  <rect x="360" y="220" width="30" height="92" rx="6" fill="#14161d" stroke="#262a34"/>
  <g fill="#9aa0ad" font-size="13" text-anchor="middle">
    <text x="375" y="244">⊕</text><text x="375" y="272" font-weight="700">T</text><text x="375" y="300">▤</text>
  </g>
  <text x="76" y="570" fill="#828a96" font-size="10">☁ Changes save automatically</text>

  <!-- arrow 1 -->
  <path d="M410 330 H452" stroke="#6c8cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── 2. Share ─────────────────────────────────────────────── -->
  <text x="466" y="108" fill="#9fb0ff" font-size="12" font-weight="700" letter-spacing="3">2 · ANSWER  /f/&lt;id&gt;/</text>
  <rect x="466" y="120" width="290" height="470" rx="8" fill="#0a0b0e" stroke="#2c3650" stroke-width="2"/>
  <rect x="482" y="136" width="258" height="96" rx="6" fill="#14161d" stroke="#262a34"/>
  <rect x="482" y="136" width="258" height="6" rx="2" fill="#6366f1"/>
  <text x="496" y="170" fill="#e7ecf5" font-size="15" font-weight="700">Staff application</text>
  <line x1="496" y1="186" x2="726" y2="186" stroke="#262a34"/>
  <circle cx="504" cy="208" r="8" fill="#5865f2"/>
  <text x="518" y="212" fill="#9aa0ad" font-size="10">Signed in as <tspan fill="#e7ecf5" font-weight="700">kilo</tspan></text>
  <rect x="482" y="242" width="258" height="112" rx="6" fill="#14161d" stroke="#262a34"/>
  <text x="496" y="266" fill="#e7ecf5" font-size="11.5">Which department? <tspan fill="#f2555a">*</tspan></text>
  <g font-size="10.5" fill="#e7ecf5">
    <circle cx="504" cy="290" r="6" fill="none" stroke="#828a96"/><text x="518" y="294">LSPD</text>
    <circle cx="504" cy="314" r="6" fill="none" stroke="#6366f1" stroke-width="2"/><circle cx="504" cy="314" r="3" fill="#6366f1"/><text x="518" y="318">BCSO</text>
    <circle cx="504" cy="338" r="6" fill="none" stroke="#828a96"/><text x="518" y="342">Fire / EMS</text>
  </g>
  <rect x="482" y="364" width="258" height="84" rx="6" fill="#14161d" stroke="#262a34"/>
  <text x="496" y="388" fill="#e7ecf5" font-size="11.5">Why BCSO?</text>
  <text x="496" y="418" fill="#b4bac6" font-size="10">County work suits my schedule…</text>
  <line x1="496" y1="428" x2="726" y2="428" stroke="#6366f1" stroke-width="2"/>
  <rect x="482" y="462" width="76" height="30" rx="5" fill="#6366f1"/>
  <text x="520" y="482" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Next</text>
  <text x="740" y="482" fill="#8b8ef5" font-size="10" text-anchor="end">Clear form</text>
  <rect x="482" y="510" width="258" height="58" rx="6" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.35"/>
  <text x="496" y="534" fill="#c7c9fb" font-size="10">Discord sign-in · one answer per</text>
  <text x="496" y="552" fill="#c7c9fb" font-size="10">account · optional editing later</text>

  <!-- arrow 2 -->
  <path d="M766 330 H808" stroke="#6c8cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── 3. Responses ─────────────────────────────────────────── -->
  <text x="822" y="108" fill="#9fb0ff" font-size="12" font-weight="700" letter-spacing="3">3 · READ  RESPONSES</text>
  <rect x="822" y="120" width="318" height="470" rx="8" fill="#0a0b0e" stroke="#2c3650" stroke-width="2"/>
  <!-- tabs -->
  <rect x="838" y="136" width="200" height="28" rx="6" fill="#14161d" stroke="#262a34"/>
  <rect x="841" y="139" width="66" height="22" rx="4" fill="#6366f1"/>
  <g font-size="9.5" font-weight="700" text-anchor="middle">
    <text x="874" y="154" fill="#fff">Summary</text>
    <text x="940" y="154" fill="#9aa0ad">Individual</text>
    <text x="1005" y="154" fill="#9aa0ad">Table</text>
  </g>
  <rect x="1048" y="136" width="76" height="28" rx="6" fill="#6366f1"/>
  <text x="1086" y="154" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle">⤓ CSV</text>
  <!-- bar chart card -->
  <rect x="838" y="176" width="286" height="170" rx="6" fill="#14161d" stroke="#262a34"/>
  <text x="852" y="200" fill="#e7ecf5" font-size="11.5" font-weight="700">Which department?</text>
  <text x="852" y="216" fill="#828a96" font-size="9">8 responses</text>
  <g font-size="10" fill="#b4bac6">
    <text x="852" y="244">LSPD</text><rect x="920" y="234" width="150" height="13" rx="3" fill="#191c24"/><rect x="920" y="234" width="150" height="13" rx="3" fill="#6366f1"/><text x="1078" y="245" fill="#e7ecf5">3</text>
    <text x="852" y="270">BCSO</text><rect x="920" y="260" width="150" height="13" rx="3" fill="#191c24"/><rect x="920" y="260" width="150" height="13" rx="3" fill="#6366f1"/><text x="1078" y="271" fill="#e7ecf5">3</text>
    <text x="852" y="296">Fire / EMS</text><rect x="920" y="286" width="150" height="13" rx="3" fill="#191c24"/><rect x="920" y="286" width="50" height="13" rx="3" fill="#6366f1"/><text x="1078" y="297" fill="#e7ecf5">1</text>
    <text x="852" y="322">Other</text><rect x="920" y="312" width="150" height="13" rx="3" fill="#191c24"/><rect x="920" y="312" width="50" height="13" rx="3" fill="#6366f1"/><text x="1078" y="323" fill="#e7ecf5">1</text>
  </g>
  <!-- stats card -->
  <rect x="838" y="356" width="286" height="96" rx="6" fill="#14161d" stroke="#262a34"/>
  <text x="852" y="380" fill="#e7ecf5" font-size="11.5" font-weight="700">Age</text>
  <g font-size="9" fill="#828a96">
    <rect x="852" y="392" width="60" height="46" rx="5" fill="#191c24"/><text x="860" y="408">Min</text><text x="860" y="428" fill="#e7ecf5" font-size="14" font-weight="700">18</text>
    <rect x="918" y="392" width="60" height="46" rx="5" fill="#191c24"/><text x="926" y="408">Max</text><text x="926" y="428" fill="#e7ecf5" font-size="14" font-weight="700">36</text>
    <rect x="984" y="392" width="60" height="46" rx="5" fill="#191c24"/><text x="992" y="408">Avg</text><text x="992" y="428" fill="#e7ecf5" font-size="14" font-weight="700">26</text>
    <rect x="1050" y="392" width="60" height="46" rx="5" fill="#191c24"/><text x="1058" y="408">Median</text><text x="1058" y="428" fill="#e7ecf5" font-size="14" font-weight="700">25.5</text>
  </g>
  <!-- text list card -->
  <rect x="838" y="462" width="286" height="106" rx="6" fill="#14161d" stroke="#262a34"/>
  <text x="852" y="486" fill="#e7ecf5" font-size="11.5" font-weight="700">Why BCSO?</text>
  <rect x="852" y="496" width="258" height="26" rx="4" fill="#191c24"/>
  <text x="862" y="513" fill="#b4bac6" font-size="9.5">County work suits my schedule…</text>
  <rect x="852" y="528" width="258" height="26" rx="4" fill="#191c24"/>
  <text x="862" y="545" fill="#b4bac6" font-size="9.5">I like rural patrol.</text>

  <text x="600" y="628" fill="#828a96" font-size="11" text-anchor="middle" letter-spacing="1">Staff only · respondents sign in with Discord · separate from the rebate surveys</text>
</svg>
