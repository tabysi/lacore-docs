<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 574 V602 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">CUSTOMER <tspan fill="#6c8cff">PORTAL</tspan> — TWO QUIET DROPS</text>

  <!-- LEFT: ticket categories -->
  <text x="60" y="108" fill="#9fb0ff" font-size="13" letter-spacing="3">SUPPORT TICKET → DISCORD BOT</text>

  <text x="60" y="140" fill="#6f7d90" font-size="11" letter-spacing="2">FORM</text>
  <g font-size="13">
    <rect x="60" y="150" width="170" height="30" rx="4" fill="#111827" stroke="#2c3650"/><text x="74" y="170" fill="#e7ecf5">Support</text>
    <rect x="60" y="186" width="170" height="30" rx="4" fill="#111827" stroke="#2c3650"/><text x="74" y="206" fill="#e7ecf5">Bug report</text>
    <rect x="60" y="222" width="170" height="30" rx="4" fill="#111827" stroke="#6c8cff"/><text x="74" y="242" fill="#e7ecf5">Installation</text>
    <rect x="60" y="258" width="170" height="30" rx="4" fill="#111827" stroke="#2c3650"/><text x="74" y="278" fill="#e7ecf5">Purchase</text>
    <rect x="60" y="294" width="170" height="30" rx="4" fill="#111827" stroke="#6c8cff"/><text x="74" y="314" fill="#e7ecf5">Feature request</text>
    <rect x="60" y="330" width="170" height="30" rx="4" fill="#111827" stroke="#6c8cff"/><text x="74" y="350" fill="#e7ecf5">Report a player</text>
    <rect x="60" y="366" width="170" height="30" rx="4" fill="#111827" stroke="#6c8cff"/><text x="74" y="386" fill="#e7ecf5">Partnership</text>
    <rect x="60" y="402" width="170" height="30" rx="4" fill="#111827" stroke="#2c3650"/><text x="74" y="422" fill="#e7ecf5">Other</text>
  </g>

  <!-- before -->
  <text x="290" y="140" fill="#6f7d90" font-size="11" letter-spacing="2">BEFORE — API KNEW 4</text>
  <g stroke="#ff6b6b" stroke-width="2" fill="none" stroke-dasharray="6 5">
    <path d="M232 237 C 280 237, 300 420, 350 420"/>
    <path d="M232 309 C 280 309, 300 420, 350 420"/>
    <path d="M232 345 C 280 345, 300 420, 350 420"/>
    <path d="M232 381 C 280 381, 300 420, 350 420"/>
  </g>
  <rect x="350" y="402" width="160" height="36" rx="4" fill="#2a1216" stroke="#ff6b6b"/>
  <text x="366" y="425" fill="#ffb3b3" font-size="13" font-weight="700">→ “other”</text>
  <text x="290" y="470" fill="#9fb0ff" font-size="12">no hint, no priority,</text>
  <text x="290" y="488" fill="#9fb0ff" font-size="12">player reports went to the AI</text>

  <!-- after -->
  <text x="290" y="200" fill="#6f7d90" font-size="11" letter-spacing="2">NOW — ALL 8 ARRIVE</text>
  <g stroke="#6c8cff" stroke-width="3" fill="none">
    <path d="M300 250 H480"/>
    <path d="M470 240 L482 250 L470 260"/>
  </g>
  <rect x="350" y="276" width="160" height="36" rx="4" fill="#121a3a" stroke="#6c8cff"/>
  <text x="366" y="299" fill="#e7ecf5" font-size="13" font-weight="700">bot: own channel</text>

  <!-- divider -->
  <line x1="600" y1="100" x2="600" y2="560" stroke="#2c3650" stroke-width="2"/>

  <!-- RIGHT: config nav scope -->
  <text x="650" y="108" fill="#9fb0ff" font-size="13" letter-spacing="3">TEAM MEMBER WITH “CONFIG” SCOPE</text>

  <!-- before sidebar -->
  <text x="650" y="140" fill="#6f7d90" font-size="11" letter-spacing="2">BEFORE</text>
  <rect x="650" y="150" width="220" height="250" rx="6" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <g font-size="13">
    <text x="670" y="182" fill="#e7ecf5">Overview</text>
    <text x="670" y="216" fill="#e7ecf5">Downloads</text>
    <text x="670" y="250" fill="#6f7d90" text-decoration="line-through">Config</text>
    <text x="670" y="284" fill="#6f7d90">…</text>
  </g>
  <text x="664" y="330" fill="#ffb3b3" font-size="12">link needed “servers”,</text>
  <text x="664" y="348" fill="#ffb3b3" font-size="12">the page needs “config”</text>
  <text x="664" y="378" fill="#9fb0ff" font-size="12">→ access, but no way in</text>

  <!-- arrow -->
  <g stroke="#6c8cff" stroke-width="3" fill="none">
    <path d="M880 275 H920"/>
    <path d="M910 265 L922 275 L910 285"/>
  </g>

  <!-- after sidebar -->
  <text x="930" y="140" fill="#6f7d90" font-size="11" letter-spacing="2">NOW</text>
  <rect x="930" y="150" width="220" height="250" rx="6" fill="#05070b" stroke="#6c8cff" stroke-width="2"/>
  <g font-size="13">
    <text x="950" y="182" fill="#e7ecf5">Overview</text>
    <text x="950" y="216" fill="#e7ecf5">Downloads</text>
    <rect x="940" y="232" width="200" height="28" rx="4" fill="#4a5cff"/>
    <text x="950" y="251" fill="#ffffff" font-weight="700">Config</text>
    <text x="950" y="284" fill="#6f7d90">…</text>
  </g>
  <text x="944" y="330" fill="#9fb0ff" font-size="12">link and page ask for</text>
  <text x="944" y="348" fill="#9fb0ff" font-size="12">the same scope</text>

  <text x="60" y="590" fill="#6f7d90" font-size="12" letter-spacing="2">LACORE 3.5.6 · CUSTOMER PORTAL</text>
</svg>
