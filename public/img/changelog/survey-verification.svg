<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5cff"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6274"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 644 V672 H1144"/>
  </g>

  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">
    SURVEY <tspan fill="#6c8cff">VERIFICATION</tspan> — WHAT AN ANSWER HAS TO PASS
  </text>
  <text x="60" y="84" fill="#9fb0ff" font-size="14">
    One response, two independent levels. Only what clears both counts toward a rebate.
  </text>

  <!-- ── the participant ─────────────────────────────────────────────────── -->
  <rect x="60" y="120" width="200" height="96" rx="8" fill="#111726" stroke="#2c3650" stroke-width="2"/>
  <text x="160" y="152" fill="#e7ecf5" font-size="15" font-weight="700" text-anchor="middle">PLAYER</text>
  <text x="160" y="176" fill="#9fb0ff" font-size="12" text-anchor="middle">opens /s/&lt;token&gt;</text>
  <text x="160" y="196" fill="#7c869c" font-size="11" text-anchor="middle">click counted server-side</text>

  <path d="M262 168 H330" stroke="#4a5cff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ── level 2: Discord ────────────────────────────────────────────────── -->
  <rect x="340" y="112" width="380" height="230" rx="8" fill="#0d1420" stroke="#1789a2" stroke-width="2"/>
  <rect x="340" y="112" width="380" height="34" rx="8" fill="#123a46"/>
  <text x="360" y="135" fill="#cfeef4" font-size="13" font-weight="700" letter-spacing="2">LEVEL 2 — DISCORD</text>
  <text x="704" y="135" fill="#7fd4e6" font-size="11" text-anchor="end">the customer does not control this</text>

  <g font-size="13">
    <circle cx="368" cy="176" r="5" fill="#3cd296"/>
    <text x="386" y="181" fill="#e7ecf5">OAuth sign-in — scope <tspan fill="#9fb0ff">identify guilds</tspan></text>

    <circle cx="368" cy="212" r="5" fill="#3cd296"/>
    <text x="386" y="217" fill="#e7ecf5">Account older than 30 days</text>
    <text x="386" y="235" fill="#7c869c" font-size="11">read from the snowflake — cannot be back-dated</text>

    <circle cx="368" cy="272" r="5" fill="#3cd296"/>
    <text x="386" y="277" fill="#e7ecf5">Member of the community guild</text>
    <text x="386" y="295" fill="#7c869c" font-size="11">guild id frozen at campaign start; the list is dropped</text>

    <circle cx="368" cy="322" r="5" fill="#3cd296"/>
    <text x="386" y="327" fill="#e7ecf5">One response per Discord ID</text>
  </g>

  <path d="M530 350 V392" stroke="#4a5cff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ── level 1: community data ─────────────────────────────────────────── -->
  <rect x="340" y="400" width="380" height="196" rx="8" fill="#161320" stroke="#6b4a8a" stroke-width="2"/>
  <rect x="340" y="400" width="380" height="34" rx="8" fill="#2c2140"/>
  <text x="360" y="423" fill="#dcc9f0" font-size="13" font-weight="700" letter-spacing="2">LEVEL 1 — COMMUNITY DATA</text>
  <text x="704" y="423" fill="#b79ad4" font-size="11" text-anchor="end">a signal, not proof</text>

  <g font-size="13">
    <circle cx="368" cy="462" r="5" fill="#e8a13c"/>
    <text x="386" y="467" fill="#e7ecf5">Identifier known here</text>

    <circle cx="368" cy="498" r="5" fill="#e8a13c"/>
    <text x="386" y="503" fill="#e7ecf5">Known for at least 14 days</text>

    <circle cx="368" cy="534" r="5" fill="#e8a13c"/>
    <text x="386" y="539" fill="#e7ecf5">Real connection activity on record</text>
  </g>
  <text x="360" y="576" fill="#b79ad4" font-size="11">
    Only rows that reached LACORE BEFORE the campaign started are counted.
  </text>

  <!-- ── outcomes ────────────────────────────────────────────────────────── -->
  <path d="M726 200 H800" stroke="#4a5cff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M726 486 H800" stroke="#5a6274" stroke-width="2" fill="none" marker-end="url(#arrowDim)"/>

  <rect x="810" y="150" width="330" height="106" rx="8" fill="#0f2018" stroke="#2f7d5a" stroke-width="2"/>
  <text x="836" y="184" fill="#3cd296" font-size="16" font-weight="700">VERIFIED</text>
  <text x="836" y="210" fill="#c8e6d8" font-size="12">Counts toward the community's rebate.</text>
  <text x="836" y="232" fill="#7fae97" font-size="11">verified ÷ frozen denominator, capped at 50 %</text>

  <rect x="810" y="286" width="330" height="140" rx="8" fill="#20180f" stroke="#8a6a2f" stroke-width="2"/>
  <text x="836" y="320" fill="#e8a13c" font-size="16" font-weight="700">REVIEW QUEUE</text>
  <text x="836" y="344" fill="#e6d8c0" font-size="12">Worth nothing until a human approves it.</text>
  <g font-size="11" fill="#ae9670">
    <text x="836" y="368">unknown_identifier · discord_missing · account_too_new</text>
    <text x="836" y="388">no_activity · duplicate · too_fast · suspicious</text>
    <text x="836" y="412" fill="#8a7a5c">every reason is stored, never collapsed to a boolean</text>
  </g>

  <rect x="810" y="456" width="330" height="140" rx="8" fill="#1e1114" stroke="#8a3540" stroke-width="2"/>
  <text x="836" y="490" fill="#f0666e" font-size="16" font-weight="700">FRAUD SCORE</text>
  <text x="836" y="514" fill="#e6c4c7" font-size="12">Per campaign, 0–100. Blocks payout at 60.</text>
  <g font-size="11" fill="#b08087">
    <text x="836" y="538">unverified share · straightlining · shared IP hashes</text>
    <text x="836" y="558">speed floor breaches · answers bunched in one window</text>
    <text x="836" y="582" fill="#8f676d">flags a campaign for a person — never decides alone</text>
  </g>

  <!-- ── footer note ─────────────────────────────────────────────────────── -->
  <rect x="60" y="612" width="1080" height="56" rx="6" fill="#0d1018" stroke="#2c3650"/>
  <text x="80" y="636" fill="#9fb0ff" font-size="12" font-weight="700">THE DENOMINATOR IS FROZEN</text>
  <text x="80" y="656" fill="#7c869c" font-size="12">
    Active accounts are counted once, when the campaign starts, and never recomputed — deleting player records afterwards cannot move a quota.
  </text>
</svg>
