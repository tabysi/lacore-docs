<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#4a5cff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 504 V532 H1144"/>
  </g>

  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">LEGAL <tspan fill="#6c8cff">PAGES</tspan> — /legal/</text>
  <text x="60" y="84" fill="#9fb0ff" font-size="14" letter-spacing="1">Four documents in the site footer. No address, no name — a contact form instead.</text>

  <!-- Document cards -->
  <g font-size="15">
    <rect x="60" y="118" width="256" height="128" rx="8" fill="#11161e" stroke="#232c42" stroke-width="2"/>
    <text x="80" y="150" fill="#6c8cff" font-size="11" letter-spacing="2">/LEGAL/IMPRINT/</text>
    <text x="80" y="180" fill="#e7ecf5" font-weight="700">Legal Notice</text>
    <text x="80" y="206" fill="#9fb0ff" font-size="13">Operator, purpose, disclaimer,</text>
    <text x="80" y="226" fill="#9fb0ff" font-size="13">copyright, complaints</text>

    <rect x="336" y="118" width="256" height="128" rx="8" fill="#11161e" stroke="#232c42" stroke-width="2"/>
    <text x="356" y="150" fill="#6c8cff" font-size="11" letter-spacing="2">/LEGAL/PRIVACY/</text>
    <text x="356" y="180" fill="#e7ecf5" font-weight="700">Privacy Policy</text>
    <text x="356" y="206" fill="#9fb0ff" font-size="13">What is processed, why,</text>
    <text x="356" y="226" fill="#9fb0ff" font-size="13">how long, your rights</text>

    <rect x="612" y="118" width="256" height="128" rx="8" fill="#11161e" stroke="#232c42" stroke-width="2"/>
    <text x="632" y="150" fill="#6c8cff" font-size="11" letter-spacing="2">/LEGAL/COOKIES/</text>
    <text x="632" y="180" fill="#e7ecf5" font-weight="700">Cookie Policy</text>
    <text x="632" y="206" fill="#9fb0ff" font-size="13">One session cookie only —</text>
    <text x="632" y="226" fill="#9fb0ff" font-size="13">no analytics, no banner</text>

    <rect x="888" y="118" width="256" height="128" rx="8" fill="#131a2c" stroke="#4a5cff" stroke-width="2"/>
    <text x="908" y="150" fill="#6c8cff" font-size="11" letter-spacing="2">/LEGAL/CONTACT/</text>
    <text x="908" y="180" fill="#e7ecf5" font-weight="700">Contact form</text>
    <text x="908" y="206" fill="#9fb0ff" font-size="13">Name, reply-to, subject,</text>
    <text x="908" y="226" fill="#9fb0ff" font-size="13">message — no account needed</text>
  </g>

  <!-- Flow -->
  <text x="60" y="308" fill="#e7ecf5" font-size="13" font-weight="700" letter-spacing="3">WHAT A SUBMISSION DOES</text>

  <g font-size="14">
    <rect x="60" y="330" width="220" height="76" rx="8" fill="#11161e" stroke="#232c42" stroke-width="2"/>
    <text x="170" y="362" fill="#e7ecf5" text-anchor="middle" font-weight="700">Visitor</text>
    <text x="170" y="384" fill="#9fb0ff" text-anchor="middle" font-size="13">fills in the form</text>

    <rect x="360" y="330" width="260" height="76" rx="8" fill="#11161e" stroke="#4a5cff" stroke-width="2"/>
    <text x="490" y="356" fill="#e7ecf5" text-anchor="middle" font-weight="700">POST /contact/submit</text>
    <text x="490" y="378" fill="#9fb0ff" text-anchor="middle" font-size="12">sessionless · rate-limited · honeypot</text>

    <rect x="700" y="306" width="260" height="60" rx="8" fill="#11161e" stroke="#232c42" stroke-width="2"/>
    <text x="830" y="332" fill="#e7ecf5" text-anchor="middle" font-weight="700">PocketBase</text>
    <text x="830" y="352" fill="#9fb0ff" text-anchor="middle" font-size="12">lacore_contacts</text>

    <rect x="700" y="382" width="260" height="60" rx="8" fill="#11161e" stroke="#232c42" stroke-width="2"/>
    <text x="830" y="408" fill="#e7ecf5" text-anchor="middle" font-weight="700">Discord webhook</text>
    <text x="830" y="428" fill="#9fb0ff" text-anchor="middle" font-size="12">CONTACT_WEBHOOK_URL</text>
  </g>

  <g stroke="#4a5cff" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M284 368 H352"/>
    <path d="M624 360 H694"/>
    <path d="M624 380 H694"/>
  </g>

  <text x="60" y="492" fill="#9fb0ff" font-size="13">Footer of the marketing page and the store links all four. Everything is English; nothing tracks the reader.</text>
</svg>
