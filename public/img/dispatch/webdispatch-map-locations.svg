<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="tiles" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1d2a44" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6c8cff"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 464 V492 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">WEB DISPATCHER — <tspan fill="#6c8cff">NAMED LOCATIONS</tspan></text>
  <text x="60" y="86" fill="#9fb0ff" font-size="15">LiveMap.locations reach the RP-WEB portal and the bridge app with every snapshot. Nothing extra to set.</text>

  <!-- config -->
  <rect x="60" y="126" width="400" height="220" rx="8" fill="#05070b" stroke="#243050" stroke-width="2"/>
  <text x="80" y="156" fill="#6c8cff" font-size="13" font-weight="700" letter-spacing="2">configs/cfg-livemap-sh.lua</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e7ecf5">
    <text x="80" y="192">LiveMap.locations = {</text>
    <text x="96" y="218">{ name = "Paleto Valley Mall",</text>
    <text x="112" y="242">x = -150, y = 6300,</text>
    <text x="112" y="266">radius = 120 },</text>
    <text x="96" y="292">{ name = "Sandy Shores Airfield",</text>
    <text x="112" y="316">points = { … } },  }</text>
  </g>

  <path d="M466 236 H 560" stroke="#6c8cff" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- RP-WEB map window -->
  <rect x="568" y="116" width="572" height="330" rx="8" fill="#0b0d12" stroke="#2c3650" stroke-width="2"/>
  <rect x="568" y="116" width="572" height="32" rx="8" fill="#12161f"/>
  <circle cx="590" cy="132" r="6" fill="#2fbf71"/>
  <text x="604" y="137" fill="#e7ecf5" font-size="13" font-weight="700">Map</text>
  <rect x="570" y="150" width="568" height="256" fill="url(#tiles)"/>

  <circle cx="720" cy="238" r="58" fill="#6c8cff" fill-opacity="0.1" stroke="#6c8cff" stroke-width="2"/>
  <text x="720" y="243" fill="#e7ecf5" font-size="14" font-weight="700" text-anchor="middle">Paleto Valley Mall</text>

  <path d="M880 300 L1090 280 L1110 370 L900 392 Z" fill="#ffc34d" fill-opacity="0.1" stroke="#ffc34d" stroke-width="2"/>
  <text x="1000" y="342" fill="#e7ecf5" font-size="14" font-weight="700" text-anchor="middle">Sandy Shores Airfield</text>

  <circle cx="760" cy="330" r="6" fill="#4a5cff" stroke="#0d0e12"/>
  <text x="760" y="350" fill="#cfe0ff" font-size="10" text-anchor="middle" font-family="Consolas, monospace">1A-12</text>
  <rect x="930" y="200" width="11" height="11" fill="#e0303a" stroke="#0d0e12"/>
  <text x="936" y="226" fill="#ff9a9a" font-size="10" text-anchor="middle" font-family="Consolas, monospace">4471</text>

  <rect x="570" y="406" width="568" height="38" fill="#0b0d12" stroke="#1c2331"/>
  <text x="590" y="430" fill="#6b7689" font-size="12" font-family="Consolas, monospace">Units round · calls square · places outlined</text>

  <text x="60" y="400" fill="#9fb0ff" font-size="14">Same outlines and names as the in-game console.</text>
  <text x="60" y="424" fill="#9fb0ff" font-size="14">showLocations = false hides them everywhere.</text>
</svg>
