<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="tiles" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1d2a44" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6c8cff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 504 V532 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">WEB DISPATCHER — <tspan fill="#6c8cff">YOUR MAP IMAGES</tspan></text>
  <text x="60" y="86" fill="#9fb0ff" font-size="15">One overlay, two addresses: the game loads url, a browser outside the game loads webUrl.</text>

  <!-- config -->
  <rect x="60" y="130" width="420" height="250" rx="8" fill="#05070b" stroke="#243050" stroke-width="2"/>
  <text x="80" y="160" fill="#6c8cff" font-size="13" font-weight="700" letter-spacing="2">configs/cfg-livemap-sh.lua</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="14">
    <text x="80" y="196" fill="#e7ecf5">{ id     = "postals",</text>
    <text x="96" y="222" fill="#e7ecf5">label  = "Postal map",</text>
    <text x="96" y="248" fill="#ffc34d">url    = "https://cfx-nui-my-maps/…",</text>
    <text x="96" y="274" fill="#7fe0a8">webUrl = "https://cdn.example.com/…",</text>
    <text x="96" y="300" fill="#e7ecf5">from   = { x = -4140, y = -4200 },</text>
    <text x="96" y="326" fill="#e7ecf5">to     = { x =  4600, y =  8440 } }</text>
  </g>
  <text x="80" y="362" fill="#9fb0ff" font-size="13">url already a public https address? No webUrl needed.</text>

  <!-- arrows -->
  <path d="M486 220 C 560 220, 580 170, 640 170" stroke="#ffc34d" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M486 290 C 560 290, 580 360, 640 360" stroke="#7fe0a8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- in-game console -->
  <rect x="648" y="120" width="492" height="120" rx="8" fill="#05070b" stroke="#6b5520" stroke-width="2"/>
  <text x="668" y="150" fill="#ffc34d" font-size="13" font-weight="700" letter-spacing="2">IN-GAME DISPATCH CONSOLE</text>
  <rect x="668" y="164" width="200" height="60" fill="url(#tiles)" stroke="#20344e"/>
  <rect x="700" y="176" width="110" height="40" fill="#4a5cff" fill-opacity="0.2" stroke="#6c8cff" stroke-dasharray="5 4"/>
  <text x="890" y="190" fill="#e7ecf5" font-size="14">loads url</text>
  <text x="890" y="212" fill="#9fb0ff" font-size="13">cfx-nui works inside FiveM</text>

  <!-- web dispatcher -->
  <rect x="648" y="290" width="492" height="190" rx="8" fill="#05070b" stroke="#2f6fd0" stroke-width="2"/>
  <text x="668" y="320" fill="#6c8cff" font-size="13" font-weight="700" letter-spacing="2">WEB DISPATCHER (RP-WEB / BRIDGE)</text>
  <rect x="668" y="334" width="300" height="110" fill="url(#tiles)" stroke="#20344e"/>
  <rect x="712" y="352" width="170" height="74" fill="#4a5cff" fill-opacity="0.2" stroke="#6c8cff" stroke-dasharray="5 4"/>
  <rect x="668" y="448" width="300" height="24" fill="#0b0d12" stroke="#1c2331"/>
  <rect x="846" y="452" width="116" height="16" rx="3" fill="#1c2a4a" stroke="#4a5cff"/>
  <text x="904" y="464" fill="#cfe0ff" font-size="11" text-anchor="middle">Postal map</text>
  <text x="988" y="360" fill="#e7ecf5" font-size="14">loads webUrl</text>
  <text x="988" y="384" fill="#9fb0ff" font-size="13">https only</text>
  <text x="988" y="408" fill="#9fb0ff" font-size="13">on/off per image,</text>
  <text x="988" y="426" fill="#9fb0ff" font-size="13">remembered per browser</text>

  <text x="60" y="510" fill="#9fb0ff" font-size="14">An overlay with only a cfx-nui url is left out of the web dispatcher — a browser cannot load it.</text>
</svg>
