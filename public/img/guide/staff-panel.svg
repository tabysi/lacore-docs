<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/><rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 504 V532 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">STAFF PANEL — <tspan fill="#6c8cff">/admin</tspan></text>

  <!-- Panel window -->
  <rect x="60" y="84" width="800" height="400" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <!-- rail -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="80" y="104" width="120" height="44" rx="8" fill="#101a2e" stroke="#4a5cff"/><text x="140" y="131" fill="#9fb0ff">1 PLAYERS</text>
    <rect x="80" y="156" width="120" height="44" rx="8" fill="#0a0d13" stroke="#2c3650"/><text x="140" y="183" fill="#6b7689">2 LOG</text>
    <rect x="80" y="208" width="120" height="44" rx="8" fill="#0a0d13" stroke="#2c3650"/><text x="140" y="235" fill="#6b7689">3 SELF</text>
    <text x="140" y="280" fill="#6b7689" font-size="11">Esc closes</text>
  </g>

  <!-- players list -->
  <rect x="216" y="104" width="380" height="360" rx="8" fill="#0a0d13" stroke="#1a2131"/>
  <rect x="228" y="116" width="356" height="24" rx="5" fill="#0e1220" stroke="#2c3650"/>
  <text x="240" y="133" fill="#6b7689" font-size="12">🔎 name · character · id · department</text>
  <g font-size="11" font-weight="700">
    <rect x="228" y="148" width="46" height="20" rx="10" fill="#101a2e" stroke="#4a5cff"/><text x="238" y="162" fill="#9fb0ff">All</text>
    <rect x="280" y="148" width="66" height="20" rx="10" fill="#0a0d13" stroke="#2c3650"/><text x="290" y="162" fill="#6b7689">On duty</text>
    <rect x="352" y="148" width="66" height="20" rx="10" fill="#0a0d13" stroke="#2c3650"/><text x="362" y="162" fill="#6b7689">Civilian</text>
    <rect x="424" y="148" width="66" height="20" rx="10" fill="#0a0d13" stroke="#2c3650"/><text x="434" y="162" fill="#6b7689">Flagged</text>
  </g>
  <g font-size="12" font-weight="600">
    <rect x="228" y="180" width="356" height="30" rx="5" fill="#101a2e"/>
    <text x="238" y="200" fill="#e7ecf5">12 · 1A-12 · M. Adams</text><text x="470" y="200" fill="#7dff7d">trust 100 · 22ms</text>
    <text x="238" y="230" fill="#9fb0ff">17 · — · S. Reed</text><text x="470" y="230" fill="#e0c93a">trust 82 · 87ms</text>
    <text x="238" y="258" fill="#9fb0ff">36 · — · M. Hale</text><text x="470" y="258" fill="#ff7b6b">trust 44 · 141ms</text>
  </g>
  <text x="406" y="440" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">Log view: Big Brother — filters · live feed · 30-day dossier per player</text>

  <!-- aside -->
  <rect x="612" y="104" width="228" height="360" rx="8" fill="#0e1220" stroke="#4a5cff" stroke-width="2"/>
  <text x="726" y="130" fill="#e7ecf5" font-size="13" font-weight="700" text-anchor="middle">SELECTED: 12 · M. ADAMS</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="628" y="146" width="92" height="26" rx="5" fill="#101a2e" stroke="#2c3650"/><text x="674" y="163" fill="#9fb0ff">GOTO</text>
    <rect x="728" y="146" width="92" height="26" rx="5" fill="#101a2e" stroke="#2c3650"/><text x="774" y="163" fill="#9fb0ff">BRING</text>
    <rect x="628" y="178" width="92" height="26" rx="5" fill="#101a2e" stroke="#2c3650"/><text x="674" y="195" fill="#9fb0ff">SPECTATE</text>
    <rect x="728" y="178" width="92" height="26" rx="5" fill="#101a2e" stroke="#2c3650"/><text x="774" y="195" fill="#9fb0ff">FREEZE</text>
    <rect x="628" y="210" width="92" height="26" rx="5" fill="#101a2e" stroke="#2c3650"/><text x="674" y="227" fill="#9fb0ff">REVIVE</text>
    <rect x="728" y="210" width="92" height="26" rx="5" fill="#101a2e" stroke="#2c3650"/><text x="774" y="227" fill="#9fb0ff">HEAL</text>
  </g>
  <line x1="628" y1="250" x2="820" y2="250" stroke="#2c3650" stroke-width="1"/>
  <text x="726" y="270" fill="#ff7b6b" font-size="11" font-weight="700" text-anchor="middle">reason + confirm required:</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="628" y="282" width="56" height="26" rx="5" fill="#2a1a0d" stroke="#d08a2a"/><text x="656" y="299" fill="#ffd9a0">KICK</text>
    <rect x="692" y="282" width="56" height="26" rx="5" fill="#1a1030" stroke="#8c14a8"/><text x="720" y="299" fill="#d8a8ff">JAIL</text>
    <rect x="756" y="282" width="64" height="26" rx="5" fill="#2a0d0d" stroke="#d04a4a"/><text x="788" y="299" fill="#ffb0b0">BAN</text>
  </g>
  <text x="726" y="336" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">every action re-checked on the</text>
  <text x="726" y="352" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">server · logged with severity warn</text>
  <text x="726" y="368" fill="#6b7689" font-size="11" font-weight="600" text-anchor="middle">+ mirrored to your admin webhook</text>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <rect x="628" y="390" width="56" height="22" rx="5" fill="#101a10" stroke="#2fae2f"/><text x="656" y="405" fill="#7dff7d">LEAD DEV</text>
    <rect x="692" y="390" width="56" height="22" rx="5" fill="#1a1610" stroke="#d08a2a"/><text x="720" y="405" fill="#ffd9a0">ADMIN</text>
    <rect x="756" y="390" width="64" height="22" rx="5" fill="#16101a" stroke="#8c14a8"/><text x="788" y="405" fill="#d8a8ff">MOD</text>
  </g>
  <text x="726" y="436" fill="#6b7689" font-size="10" font-weight="600" text-anchor="middle">Mod: soft actions + kick · Admin: + jail &amp; ban</text>

  <!-- reports column -->
  <rect x="880" y="104" width="250" height="360" rx="10" fill="#0a0d13" stroke="#2c3650" stroke-width="2"/>
  <text x="1005" y="134" fill="#e7ecf5" font-size="14" font-weight="700" text-anchor="middle">PLAYER REPORTS</text>
  <g font-size="12" font-weight="600" fill="#9fb0ff">
    <text x="900" y="164">/report &lt;id&gt; &lt;message&gt;</text>
    <text x="900" y="186" fill="#6b7689">→ webhook + staff queue</text>
    <text x="900" y="222" fill="#7dff7d">/rs — reply + solve</text>
    <text x="900" y="248" fill="#e0c93a">/rr — reply, keep open</text>
    <text x="900" y="274" fill="#ff7b6b">/rd — dismiss</text>
    <text x="900" y="314" fill="#6b7689">answers the oldest</text>
    <text x="900" y="332" fill="#6b7689">open report first</text>
  </g>

  <text x="60" y="520" fill="#6b7689" font-size="15" font-weight="600">/bblog opens the same window straight on the log view · Self tools (noclip, god, invis) are client-side and never logged.</text>
</svg>
