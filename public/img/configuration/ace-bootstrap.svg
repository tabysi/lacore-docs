<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/><stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6c8cff"/>
    </marker>
    <marker id="arrbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e05a5a"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none"><path d="M28 56 V28 H56"/><path d="M1172 504 V532 H1144"/></g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">ACE BOOTSTRAP — <tspan fill="#6c8cff">WHO MAY CREATE THE GROUPS</tspan></text>

  <!-- granted row -->
  <text x="60" y="112" fill="#9fb0ff" font-size="13" letter-spacing="3">WITH THE THREE add_ace LINES IN server.cfg</text>
  <g font-size="13" fill="#e7ecf5">
    <rect x="60" y="128" width="240" height="118" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
    <text x="180" y="164" text-anchor="middle" font-weight="700">server.cfg</text>
    <text x="180" y="190" text-anchor="middle" fill="#9fb0ff" font-size="11">add_ace resource.lacore</text>
    <text x="180" y="208" text-anchor="middle" fill="#9fb0ff" font-size="11">command.add_ace allow</text>
    <text x="180" y="228" text-anchor="middle" fill="#9fb0ff" font-size="11">(+ add_principal, remove_principal)</text>

    <rect x="350" y="128" width="240" height="118" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
    <text x="470" y="164" text-anchor="middle" font-weight="700">LACORE starts</text>
    <text x="470" y="190" text-anchor="middle" fill="#9fb0ff" font-size="11">SetupAceGroups() runs</text>
    <text x="470" y="210" text-anchor="middle" fill="#9fb0ff" font-size="11">21x add_ace · 2x add_principal</text>
    <text x="470" y="230" text-anchor="middle" fill="#7fd6a5" font-size="11">accepted</text>

    <rect x="640" y="128" width="240" height="118" rx="10" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
    <text x="760" y="164" text-anchor="middle" font-weight="700">Groups exist</text>
    <text x="760" y="190" text-anchor="middle" fill="#9fb0ff" font-size="11">group.lacore_dev</text>
    <text x="760" y="208" text-anchor="middle" fill="#9fb0ff" font-size="11">group.lacore_staff</text>
    <text x="760" y="226" text-anchor="middle" fill="#9fb0ff" font-size="11">group.lacore_mod</text>

    <rect x="930" y="128" width="210" height="118" rx="10" fill="#0b1220" stroke="#4a5cff" stroke-width="2"/>
    <text x="1035" y="164" text-anchor="middle" font-weight="700" fill="#9fb0ff">Discord role</text>
    <text x="1035" y="190" text-anchor="middle" fill="#e7ecf5" font-size="11">bridged into the group</text>
    <text x="1035" y="216" text-anchor="middle" fill="#7fd6a5" font-size="12" font-weight="700">/ban /kick /staff work</text>
  </g>
  <g stroke="#6c8cff" stroke-width="2" marker-end="url(#arr)" fill="none">
    <path d="M300 187 H344"/><path d="M590 187 H634"/><path d="M880 187 H924"/>
  </g>

  <!-- denied row -->
  <text x="60" y="322" fill="#e08a8a" font-size="13" letter-spacing="3">WITHOUT THEM</text>
  <g font-size="13" fill="#e7ecf5">
    <rect x="60" y="338" width="240" height="118" rx="10" fill="#05070b" stroke="#4a2c34" stroke-width="2"/>
    <text x="180" y="374" text-anchor="middle" font-weight="700">server.cfg</text>
    <text x="180" y="402" text-anchor="middle" fill="#9fb0ff" font-size="11">nothing granted</text>
    <text x="180" y="424" text-anchor="middle" fill="#9fb0ff" font-size="11">resource.lacore has no rights</text>

    <rect x="350" y="338" width="240" height="118" rx="10" fill="#05070b" stroke="#4a2c34" stroke-width="2"/>
    <text x="470" y="374" text-anchor="middle" font-weight="700">FiveM refuses</text>
    <text x="470" y="402" text-anchor="middle" fill="#e05a5a" font-size="11">Access denied for command</text>
    <text x="470" y="420" text-anchor="middle" fill="#e05a5a" font-size="11">add_ace. (x21)</text>
    <text x="470" y="440" text-anchor="middle" fill="#e05a5a" font-size="11">add_principal. (x2)</text>

    <rect x="640" y="338" width="240" height="118" rx="10" fill="#05070b" stroke="#4a2c34" stroke-width="2"/>
    <text x="760" y="374" text-anchor="middle" font-weight="700">Groups stay empty</text>
    <text x="760" y="402" text-anchor="middle" fill="#9fb0ff" font-size="11">no command.* ACEs</text>
    <text x="760" y="422" text-anchor="middle" fill="#9fb0ff" font-size="11">no inheritance</text>

    <rect x="930" y="338" width="210" height="118" rx="10" fill="#160b0e" stroke="#e05a5a" stroke-width="2"/>
    <text x="1035" y="374" text-anchor="middle" font-weight="700" fill="#e08a8a">Staff role held</text>
    <text x="1035" y="402" text-anchor="middle" fill="#e7ecf5" font-size="11">bridged into an empty group</text>
    <text x="1035" y="428" text-anchor="middle" fill="#e05a5a" font-size="12" font-weight="700">/ban /kick still refused</text>
  </g>
  <g stroke="#e05a5a" stroke-width="2" marker-end="url(#arrbad)" fill="none">
    <path d="M300 397 H344"/><path d="M590 397 H634"/><path d="M880 397 H924"/>
  </g>

  <text x="60" y="512" fill="#9fb0ff" font-size="12">Devmode hides the symptom: HasPermission() passes everyone, so the empty groups only bite once devmode is off.</text>
</svg>
