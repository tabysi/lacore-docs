<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 700" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7bb7"/>
      <stop offset="1" stop-color="#2d5c96"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ecf5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 644 V672 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">SPILLMAN <tspan fill="#6c8cff">FLEX MOBILE</tspan> — CALL SCREEN</text>

  <!-- window -->
  <rect x="60" y="80" width="1080" height="520" fill="#dbe7f3" stroke="#6d8bb0" stroke-width="2"/>
  <rect x="60" y="80" width="1080" height="22" fill="#ffffff"/>
  <text x="72" y="96" fill="#1b1b1b" font-size="12" font-family="'Segoe UI', system-ui, sans-serif">Spillman Flex Mobile - [Call]</text>
  <rect x="60" y="102" width="1080" height="20" fill="#4f80bc"/>
  <text x="72" y="116" fill="#eef4fb" font-size="12" font-family="'Segoe UI', system-ui, sans-serif">File    Search    Screens    Actions    Tools    Help</text>

  <!-- toolbar -->
  <rect x="60" y="122" width="1080" height="58" fill="url(#tool)"/>
  <g font-size="10" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="70"  y="128" width="70" height="46" rx="3" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/>
    <circle cx="105" cy="146" r="10" fill="#f2c200"/><text x="105" y="168">Alt+Left</text>
    <rect x="146" y="128" width="70" height="46" rx="3" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/>
    <circle cx="181" cy="146" r="10" fill="#9aa7b8"/><text x="181" y="168">Alt+Right</text>
    <rect x="222" y="128" width="70" height="46" rx="3" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="257" y="150" font-size="16">⌂</text><text x="257" y="168">Alt+Home</text>
    <rect x="298" y="128" width="70" height="46" rx="3" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="333" y="150" font-size="14">⌕</text><text x="333" y="168">Ctrl+J</text>
    <rect x="374" y="128" width="70" height="46" rx="3" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="409" y="150" font-size="14">✉</text><text x="409" y="168">Ctrl+M</text>
    <rect x="450" y="128" width="70" height="46" rx="3" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="485" y="150" font-size="14">☎</text><text x="485" y="168">Ctrl+L</text>
    <rect x="526" y="128" width="70" height="46" rx="3" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="561" y="150" font-size="14">★</text><text x="561" y="168">Ctrl+B</text>
    <rect x="602" y="128" width="70" height="46" rx="3" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="637" y="150" font-size="14">▤</text><text x="637" y="168">Ctrl+O</text>
  </g>
  <text x="1124" y="164" fill="#ffffff" font-size="38" font-weight="900" text-anchor="end" font-family="'Arial Black', 'Segoe UI', sans-serif">FLEX</text>

  <!-- status keys -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="66" y="188" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="208" font-size="14" fill="#111c2b">ASSGN</text><text x="112" y="220" font-size="8" fill="#5b6d83">F2</text>
    <rect x="66" y="228" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="248" font-size="14" fill="#111c2b">RCVD</text><text x="112" y="260" font-size="8" fill="#5b6d83">F3</text>
    <rect x="66" y="268" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="288" font-size="14" fill="#111c2b">ENRT</text><text x="112" y="300" font-size="8" fill="#5b6d83">F4</text>
    <rect x="66" y="308" width="92" height="36" rx="3" fill="#2f4d78" stroke="#1a2d4a"/><text x="112" y="328" font-size="14" fill="#ffffff">ARRVD</text><text x="112" y="340" font-size="8" fill="#cfd9e8">F5</text>
    <rect x="66" y="348" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="368" font-size="14" fill="#111c2b">CMPLT</text><text x="112" y="380" font-size="8" fill="#5b6d83">F6</text>
    <rect x="66" y="388" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="408" font-size="14" fill="#111c2b">ONAIR</text><text x="112" y="420" font-size="8" fill="#5b6d83">F7</text>
    <rect x="66" y="428" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="448" font-size="14" fill="#111c2b">ONDT</text><text x="112" y="460" font-size="8" fill="#5b6d83">F8</text>
    <rect x="66" y="468" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="488" font-size="14" fill="#111c2b">BUSY</text><text x="112" y="500" font-size="8" fill="#5b6d83">F9</text>
    <rect x="66" y="508" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="528" font-size="14" fill="#111c2b">OSTN</text><text x="112" y="540" font-size="8" fill="#5b6d83">F10</text>
    <rect x="66" y="548" width="92" height="36" rx="3" fill="url(#key)" stroke="#a9bed5"/><text x="112" y="568" font-size="14" fill="#111c2b">UNAV</text><text x="112" y="580" font-size="8" fill="#5b6d83">F11</text>
  </g>

  <!-- call header -->
  <rect x="166" y="186" width="968" height="64" fill="#ffffff" stroke="#a9bed5"/>
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text x="176" y="204" font-size="15" fill="#111c2b">911 [1042]</text>
    <text x="176" y="224" font-size="17" font-weight="700" fill="#111c2b">3050 VINEWOOD BLVD</text>
    <text x="176" y="243" font-size="14" fill="#111c2b">LOS SANTOS</text>
    <rect x="266" y="231" width="28" height="15" fill="#e30000"/><text x="280" y="243" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">P1</text>
    <text x="560" y="204" font-size="11" fill="#111c2b">Cmplt: Eric Long</text>
    <line x1="700" y1="190" x2="700" y2="246" stroke="#a9bed5"/>
    <text x="712" y="208" font-size="17" font-weight="700" fill="#111c2b">W3603</text>
    <rect x="772" y="193" width="60" height="19" fill="#ffe600"/><text x="802" y="208" font-size="14" font-weight="700" fill="#111" text-anchor="middle">ARRVD</text>
    <text x="712" y="230" font-size="11" fill="#111c2b">2-ADAM-4 // 911 // 3050 Vinewood Blvd</text>
  </g>

  <!-- map -->
  <rect x="166" y="254" width="760" height="232" fill="#0b1a2c" stroke="#a9bed5"/>
  <g stroke="#2b4a6e" stroke-width="1" fill="none">
    <path d="M166 330 C300 300, 500 360, 926 300"/><path d="M300 254 L380 486"/><path d="M620 254 C600 360, 700 420, 760 486"/>
    <path d="M166 430 C380 400, 600 460, 926 420"/>
  </g>
  <rect x="520" y="340" width="40" height="16" fill="#ffe600"/><text x="540" y="352" font-size="10" font-weight="700" fill="#000" text-anchor="middle">1042</text>
  <rect x="700" y="300" width="40" height="16" fill="#c0241a"/><text x="720" y="312" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1043</text>
  <text x="546" y="478" fill="#9fb0ff" font-size="12" text-anchor="middle" letter-spacing="2">LIVE MAP — CALLS + UNITS</text>

  <!-- side panel -->
  <rect x="932" y="254" width="202" height="80" fill="#ffffff" stroke="#a9bed5"/>
  <text x="940" y="272" font-size="11" fill="#111c2b" font-family="'Segoe UI', system-ui, sans-serif">Narrative / notes</text>
  <rect x="932" y="338" width="202" height="76" fill="#ffffff" stroke="#e30000" stroke-width="2"/>
  <text x="940" y="352" font-size="9" fill="#5b6d83" font-family="'Segoe UI', system-ui, sans-serif">19:15 - W3603</text>
  <text x="940" y="368" font-size="11" fill="#111c2b" font-family="'Segoe UI', system-ui, sans-serif">Newest comment</text>
  <rect x="932" y="418" width="202" height="20" fill="url(#key)" stroke="#a9bed5"/><text x="1033" y="432" font-size="11" fill="#111c2b" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">Add Comment</text>
  <rect x="932" y="442" width="202" height="20" fill="url(#key)" stroke="#a9bed5"/><text x="1033" y="456" font-size="11" fill="#111c2b" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">Radio Log Entry</text>
  <rect x="932" y="466" width="99" height="20" fill="url(#key)" stroke="#a9bed5"/><text x="981" y="480" font-size="11" font-weight="700" fill="#e30000" text-anchor="middle">PANIC</text>
  <rect x="1035" y="466" width="99" height="20" fill="url(#key)" stroke="#a9bed5"/><text x="1084" y="480" font-size="11" font-weight="700" fill="#111c2b" text-anchor="middle">BACKUP</text>

  <!-- call log -->
  <rect x="166" y="490" width="968" height="96" fill="#ffffff" stroke="#a9bed5"/>
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#111c2b">
    <text x="174" y="505">Unit: W3603, ARRVD · Call: 1042, 911 · Units: W3603 (ARRVD), M241 (BUSY)</text>
    <rect x="167" y="512" width="966" height="20" fill="#fff7a8"/>
    <text x="174" y="526" font-weight="700">19:15    W3603    Both parties still in contact with each other. 3 calls on this.</text>
    <text x="174" y="548">19:12    DISPATCH    Caller reports two males arguing over a barking dog.</text>
  </g>

  <!-- status bar -->
  <rect x="60" y="588" width="1080" height="12" fill="#e3ecf5"/>
  <text x="70" y="598" font-size="9" fill="#111c2b" font-family="'Segoe UI', system-ui, sans-serif">● Status: ARRVD 00:17:01 | Total: 00:12:44 | 19:17:11 | State Returns: 1 | Messages: 0 | No Alerts</text>

  <!-- callouts -->
  <g font-size="13" fill="#9fb0ff" letter-spacing="1">
    <text x="60" y="630"><tspan fill="#6c8cff" font-weight="700">①</tspan> Status keys F2–F11 (configurable)</text>
    <text x="400" y="630"><tspan fill="#6c8cff" font-weight="700">②</tspan> Call header + your unit status</text>
    <text x="720" y="630"><tspan fill="#6c8cff" font-weight="700">③</tspan> Newest comment, panic &amp; backup</text>
    <text x="60" y="656"><tspan fill="#6c8cff" font-weight="700">④</tspan> Live map with every active call</text>
    <text x="400" y="656"><tspan fill="#6c8cff" font-weight="700">⑤</tspan> Call log — newest entry highlighted</text>
    <text x="720" y="656"><tspan fill="#6c8cff" font-weight="700">⑥</tspan> Toolbar: Back / Home / Search / Messages</text>
  </g>
</svg>
