<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="tiles" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1d2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 544 V572 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">LASD MDC — <tspan fill="#6c8cff">MAP COMMAND</tspan></text>
  <text x="60" y="86" fill="#9fb0ff" font-size="15">NEW MESSAGE → type MAP → Enter. The map opens in the Message Detail / Default window.</text>

  <!-- terminal -->
  <rect x="60" y="112" width="1080" height="440" fill="#0a0a0a" stroke="#1789a2" stroke-width="2"/>
  <!-- top row -->
  <g font-size="10" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="72" y="122" width="90" height="34" fill="#1789a2"/><text x="117" y="143">CLEAR DISP</text>
    <rect x="168" y="122" width="90" height="34" fill="#1789a2"/><text x="213" y="143">ACK</text>
    <rect x="264" y="122" width="90" height="34" fill="#1789a2"/><text x="309" y="143">ENRT</text>
    <rect x="360" y="122" width="90" height="34" fill="#1789a2"/><text x="405" y="143">10-97</text>
    <rect x="456" y="122" width="90" height="34" fill="#1789a2"/><text x="501" y="143">10-98</text>
    <rect x="552" y="122" width="90" height="34" fill="#1789a2"/><text x="597" y="143">OBS</text>
    <rect x="648" y="122" width="90" height="34" fill="#1789a2"/><text x="693" y="143">STATUS TEXT</text>
    <rect x="744" y="122" width="90" height="34" fill="#1789a2"/><text x="789" y="143">CODE 6</text>
    <rect x="840" y="122" width="90" height="34" fill="#0d6a80" stroke="#e0c93a" stroke-width="2"/><text x="885" y="143">NEW MESSAGE</text>
    <rect x="936" y="122" width="90" height="34" fill="#1789a2"/><text x="981" y="143">CLEAR DEF</text>
  </g>

  <!-- left column -->
  <rect x="72" y="166" width="250" height="374" fill="#000" stroke="#1789a2"/>
  <rect x="72" y="166" width="250" height="20" fill="#c7ad1d"/>
  <text x="82" y="181" fill="#000" font-size="11" font-weight="700">DISPATCH INDEX</text>
  <rect x="76" y="192" width="242" height="18" fill="#1789a2"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700">
    <text x="82" y="205" fill="#fff">16:12  0042  415  (D)</text>
    <text x="82" y="228" fill="#e0c93a">16:20  0043  459  (U)  12A3</text>
  </g>

  <!-- main window with map -->
  <rect x="334" y="166" width="794" height="20" fill="#c7ad1d"/>
  <text x="344" y="181" fill="#000" font-size="11" font-weight="700">MESSAGE DETAIL/DEFAULT WINDOW</text>
  <rect x="334" y="186" width="794" height="310" fill="#000"/>
  <rect x="342" y="194" width="84" height="20" fill="#1789a2" stroke="#2199b4"/>
  <text x="384" y="208" fill="#fff" font-size="11" text-anchor="middle">Postal map</text>
  <rect x="342" y="220" width="778" height="268" fill="#05070b" stroke="#1789a2" stroke-width="2"/>
  <rect x="344" y="222" width="774" height="264" fill="url(#tiles)"/>
  <rect x="400" y="248" width="280" height="200" fill="#4a5cff" fill-opacity="0.16" stroke="#6c8cff" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="900" cy="300" r="52" fill="#6c8cff" fill-opacity="0.1" stroke="#6c8cff" stroke-width="2"/>
  <text x="900" y="305" fill="#e7ecf5" font-size="13" font-weight="700" text-anchor="middle">Paleto Valley Mall</text>

  <rect x="520" y="330" width="70" height="18" rx="2" fill="#b3261e" stroke="#000"/>
  <text x="555" y="343" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">0042 415</text>
  <rect x="600" y="394" width="50" height="18" rx="2" fill="#000" stroke="#e0c93a" stroke-width="2"/>
  <text x="625" y="407" fill="#e0c93a" font-size="11" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">12A3</text>
  <text x="560" y="322" fill="#9fb0c8" font-size="12" text-anchor="middle">click → incident record</text>

  <!-- command bar -->
  <rect x="334" y="504" width="794" height="30" fill="#1f4ea3"/>
  <text x="731" y="524" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas, monospace" letter-spacing="2">MAP ⏎</text>
</svg>
