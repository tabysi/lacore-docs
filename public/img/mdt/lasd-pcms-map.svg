<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="tiles" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1d2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 544 V572 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">LASD PCMS — <tspan fill="#6c8cff">MAP KEY</tspan></text>
  <text x="60" y="86" fill="#9fb0ff" font-size="15">A MAP key in the coloured function rail, under BOLO. The map opens in the centre window.</text>

  <!-- terminal -->
  <rect x="60" y="112" width="1080" height="440" fill="#050505" stroke="#16776a" stroke-width="2"/>
  <rect x="60" y="112" width="1080" height="26" fill="#0c0c0c"/>
  <text x="76" y="130" fill="#2ab5a0" font-size="12" font-weight="700" letter-spacing="2">PORTABLE COMPUTER MESSAGING SYSTEM</text>

  <!-- left index -->
  <rect x="72" y="148" width="230" height="392" fill="#000" stroke="#16776a"/>
  <text x="84" y="168" fill="#f2ea9a" font-size="11" font-weight="700">DISPATCH INDEX</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700">
    <rect x="76" y="176" width="222" height="18" fill="#0a3d35"/>
    <text x="84" y="189" fill="#e3d98f">1612  260917-0042  R 415</text>
    <text x="84" y="212" fill="#e3d98f">1620  260917-0043  R 459</text>
  </g>

  <!-- centre -->
  <text x="316" y="168" fill="#f2ea9a" font-size="11" font-weight="700">MESSAGE DETAIL / DEFAULT WINDOW</text>
  <rect x="312" y="176" width="708" height="364" fill="#000"/>
  <rect x="320" y="184" width="84" height="20" fill="#16776a" stroke="#2ab5a0"/>
  <text x="362" y="198" fill="#fff" font-size="11" text-anchor="middle">Postal map</text>
  <rect x="320" y="210" width="692" height="322" fill="#05070b" stroke="#16776a" stroke-width="2"/>
  <rect x="322" y="212" width="688" height="318" fill="url(#tiles)"/>
  <rect x="370" y="240" width="260" height="210" fill="#4a5cff" fill-opacity="0.16" stroke="#6c8cff" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="860" cy="300" r="52" fill="#6c8cff" fill-opacity="0.1" stroke="#6c8cff" stroke-width="2"/>
  <text x="860" y="305" fill="#e7ecf5" font-size="13" font-weight="700" text-anchor="middle">Paleto Valley Mall</text>
  <rect x="470" y="330" width="120" height="18" rx="2" fill="#b3261e" stroke="#000"/>
  <text x="530" y="343" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">260917-0042 415</text>
  <rect x="560" y="400" width="50" height="18" rx="2" fill="#000" stroke="#2ab5a0" stroke-width="2"/>
  <text x="585" y="413" fill="#2ab5a0" font-size="11" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">12A3</text>
  <text x="530" y="322" fill="#9fb0c8" font-size="12" text-anchor="middle">click → incident record</text>

  <!-- function rail -->
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="1030" y="148" width="98" height="36" fill="#c0392b"/><text x="1079" y="171">VEH</text>
    <rect x="1030" y="190" width="98" height="36" fill="#1e8f3a"/><text x="1079" y="213">WANT</text>
    <rect x="1030" y="232" width="98" height="36" fill="#2a86b8"/><text x="1079" y="255">DMV</text>
    <rect x="1030" y="274" width="98" height="36" fill="#7a3fb0"/><text x="1079" y="297">INQUIRIES</text>
    <rect x="1030" y="316" width="98" height="36" fill="#b8761f"/><text x="1079" y="339">BOLO</text>
    <rect x="1030" y="358" width="98" height="36" fill="#1f6f9a" stroke="#f2ea9a" stroke-width="2"/><text x="1079" y="381">MAP</text>
    <rect x="1030" y="400" width="98" height="36" fill="#d97a1f"/><text x="1079" y="416">CALL &amp; LOG</text><text x="1079" y="430">FUNCTIONS</text>
    <rect x="1030" y="442" width="98" height="36" fill="#b09a4a"/><text x="1079" y="458" fill="#1a1500">OTHER</text><text x="1079" y="472" fill="#1a1500">FUNCTIONS</text>
    <rect x="1030" y="484" width="98" height="36" fill="#16976f"/><text x="1079" y="507">SEND</text>
  </g>
</svg>
