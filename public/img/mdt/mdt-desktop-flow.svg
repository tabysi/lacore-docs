<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 620" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14243c"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a5cff"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect width="1200" height="620" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 564 V592 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">MDT <tspan fill="#6c8cff">DESKTOP</tspan> — WHAT /mdt DOES</text>
  <text x="60" y="84" fill="#9fb0ff" font-size="14">Boot and sign-in run once per shift · every later /mdt resumes straight to the desktop</text>

  <!-- 1 boot -->
  <rect x="60" y="110" width="250" height="160" rx="6" fill="url(#scr)" stroke="#2c3650"/>
  <text x="185" y="165" fill="#e8f0fb" font-size="20" font-weight="800" letter-spacing="5" text-anchor="middle">LACORE</text>
  <g font-family="Consolas, monospace" font-size="9" fill="#93a7c0">
    <text x="82" y="192">Firmware .............. [ OK ]</text>
    <text x="82" y="206">Processor check ....... [ OK ]</text>
    <text x="82" y="220">Memory 8192 MB ........ [ OK ]</text>
    <text x="82" y="234">Radio link ............ [ OK ]</text>
    <text x="82" y="248">CAD services .......... [ OK ]</text>
  </g>
  <text x="60" y="292" fill="#6c8cff" font-size="13" font-weight="700">① BOOT</text>
  <text x="60" y="310" fill="#9fb0ff" font-size="12">POST lines, ~4.5 s (configurable)</text>

  <!-- 2 sign in -->
  <rect x="350" y="110" width="250" height="160" rx="6" fill="url(#scr)" stroke="#2c3650"/>
  <text x="475" y="146" fill="#f2f6fc" font-size="26" font-weight="300" text-anchor="middle">20:47</text>
  <circle cx="475" cy="182" r="20" fill="#59a0f5"/>
  <text x="475" y="188" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">AM</text>
  <text x="475" y="216" fill="#eef4fb" font-size="12" text-anchor="middle">Alex Mercer</text>
  <rect x="405" y="224" width="140" height="16" rx="3" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="475" y="236" fill="#dbe6f4" font-size="10" text-anchor="middle" letter-spacing="3">••••••••</text>
  <rect x="405" y="244" width="140" height="17" rx="3" fill="#2f6fd0"/>
  <text x="475" y="256" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Sign in</text>
  <text x="350" y="292" fill="#6c8cff" font-size="13" font-weight="700">② SIGN IN</text>
  <text x="350" y="310" fill="#9fb0ff" font-size="12">An animation, not a password check</text>

  <!-- 3 desktop -->
  <rect x="640" y="110" width="250" height="160" rx="6" fill="url(#scr)" stroke="#2c3650"/>
  <g>
    <rect x="662" y="126" width="22" height="22" rx="4" fill="#59a0f5"/><text x="673" y="158" fill="#dbe6f4" font-size="8" text-anchor="middle">LSPD</text>
    <rect x="712" y="126" width="22" height="22" rx="4" fill="#59a0f5"/><text x="723" y="158" fill="#dbe6f4" font-size="8" text-anchor="middle">Dispatch</text>
    <rect x="662" y="170" width="22" height="22" rx="4" fill="#59a0f5"/><text x="673" y="202" fill="#dbe6f4" font-size="8" text-anchor="middle">Notes</text>
    <rect x="712" y="170" width="22" height="22" rx="4" fill="#59a0f5"/><text x="723" y="202" fill="#dbe6f4" font-size="8" text-anchor="middle">Settings</text>
  </g>
  <rect x="640" y="250" width="250" height="20" fill="#080e18" stroke="#2c3650"/>
  <rect x="646" y="254" width="46" height="12" rx="2" fill="#2f6fd0"/>
  <text x="669" y="263" fill="#fff" font-size="7" text-anchor="middle">LACORE</text>
  <text x="876" y="263" fill="#c3d2e4" font-size="7" text-anchor="end">MDT-1L30 · 20:47</text>
  <text x="640" y="292" fill="#6c8cff" font-size="13" font-weight="700">③ DESKTOP</text>
  <text x="640" y="310" fill="#9fb0ff" font-size="12">Icons, Start menu, taskbar, clock</text>

  <!-- 4 terminal -->
  <rect x="930" y="110" width="210" height="160" rx="6" fill="#0b1626" stroke="#2c3650"/>
  <rect x="946" y="124" width="178" height="132" rx="3" fill="#dbe7f3" stroke="#6d8bb0"/>
  <rect x="946" y="124" width="178" height="14" fill="#2d5c96"/>
  <text x="1035" y="134" fill="#fff" font-size="8" text-anchor="middle">Department CAD</text>
  <g stroke="#a9bed5" stroke-width="1">
    <path d="M946 160 H1124 M946 180 H1124 M946 200 H1124 M946 220 H1124"/>
    <path d="M1000 146 V256"/>
  </g>
  <text x="930" y="292" fill="#6c8cff" font-size="13" font-weight="700">④ THE CAD</text>
  <text x="930" y="310" fill="#9fb0ff" font-size="12">Opens on top — Esc goes back to ③</text>

  <g stroke="#4a5cff" stroke-width="2" marker-end="url(#arw)">
    <path d="M314 190 H344"/>
    <path d="M604 190 H634"/>
    <path d="M894 190 H924"/>
  </g>

  <!-- second row: the shift -->
  <rect x="60" y="356" width="1080" height="200" rx="6" fill="#070b12" stroke="#2c3650"/>
  <text x="84" y="386" fill="#e7ecf5" font-size="15" font-weight="700" letter-spacing="2">ONE SHIFT</text>
  <g font-size="13">
    <circle cx="150" cy="430" r="8" fill="#4a5cff"/>
    <text x="172" y="435" fill="#e7ecf5">/onduty LSPD 1-L-30 — the computer is off</text>
    <circle cx="150" cy="466" r="8" fill="#4a5cff"/>
    <text x="172" y="471" fill="#e7ecf5">first /mdt — boot, sign in, desktop, click the CAD</text>
    <circle cx="150" cy="502" r="8" fill="#6c8cff"/>
    <text x="172" y="507" fill="#9fb0ff">Esc in the CAD — back to the desktop, the computer stays on</text>
    <circle cx="700" cy="430" r="8" fill="#6c8cff"/>
    <text x="722" y="435" fill="#9fb0ff">/mdt again — standby, straight to the desktop</text>
    <circle cx="700" cy="466" r="8" fill="#6c8cff"/>
    <text x="722" y="471" fill="#9fb0ff">Start → Shut down (or Esc) — everything closes</text>
    <circle cx="700" cy="502" r="8" fill="#4a5cff"/>
    <text x="722" y="507" fill="#e7ecf5">/offduty — next shift boots cold again</text>
  </g>
</svg>
