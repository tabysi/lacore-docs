    <text x="716" y="148" fill="#d2ffe2" font-size="14" font-weight="700">Ranger Green</text>
    <text x="628" y="188" fill="#6fae8a" font-size="12">Park Ranger / Game Warden</text>

    <rect x="888" y="112" width="252" height="96" rx="6" fill="#0c2317" stroke="#1d4a31" stroke-width="2"/>
    <rect x="904" y="128" width="72" height="30" rx="3" fill="#c9a227"/>
