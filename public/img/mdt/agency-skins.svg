    <text x="716" y="380" fill="#e6eaf2" font-size="14" font-weight="700">Slate</text>
    <text x="628" y="420" fill="#8893a3" font-size="12">neutral graphite</text>

    <rect x="888" y="344" width="122" height="96" rx="6" fill="#eef1f6" stroke="#c5cfdd" stroke-width="2"/>
    <rect x="900" y="360" width="60" height="26" rx="3" fill="#2457a6"/>
    <text x="930" y="378" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CALLS</text>
    <text x="900" y="406" fill="#182033" font-size="13" font-weight="700">White</text>
    <text x="900" y="426" fill="#51627d" font-size="11">light mode</text>

    <rect x="1018" y="344" width="122" height="96" rx="6" fill="#121212" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="1030" y="360" width="60" height="26" rx="3" fill="#e6e6e6"/>
    <text x="1060" y="378" fill="#000000" font-size="11" font-weight="700" text-anchor="middle">CALLS</text>
    <text x="1030" y="406" fill="#f4f4f4" font-size="13" font-weight="700">Black</text>
    <text x="1030" y="426" fill="#9a9a9a" font-size="11">high contrast</text>
  </g>

  <rect x="60" y="466" width="1080" height="100" rx="8" fill="#05070b" stroke="#2c3650" stroke-width="2"/>
  <text x="84" y="498" fill="#9fb0ff" font-size="14" font-weight="700" letter-spacing="2">A SKIN IS A PALETTE, NOTHING ELSE</text>
  <text x="84" y="524" fill="#7d8798" font-size="13">Same markup, same data, same server rules — only ten CSS variables change. Your choice is remembered per player, per browser.</text>
  <text x="84" y="548" fill="#7d8798" font-size="13">Every skin's text on a filled accent key clears a 4.5:1 contrast ratio, checked rather than assumed.</text>
</svg>
