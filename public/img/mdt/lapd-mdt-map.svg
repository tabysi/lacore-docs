<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="tiles" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1d2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 544 V572 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">LAPD MDT — <tspan fill="#6c8cff">MAP RAIL SECTION</tspan></text>
  <text x="60" y="86" fill="#9fb0ff" font-size="15">A live map in the left rail — the ribbon keeps its nine tools. Same map layers as the dispatch console.</text>

  <!-- terminal frame -->
  <rect x="60" y="112" width="1080" height="440" fill="#16294d" stroke="#ffffff" stroke-width="3"/>
  <!-- ribbon -->
  <rect x="60" y="112" width="1080" height="54" fill="#0f1f3d"/>
  <g fill="#16294d" stroke="#5a6b8c">
    <rect x="72" y="120" width="70" height="38"/><rect x="150" y="120" width="70" height="38"/><rect x="228" y="120" width="70" height="38"/>
    <rect x="306" y="120" width="70" height="38"/><rect x="384" y="120" width="70" height="38"/><rect x="462" y="120" width="70" height="38"/>
    <rect x="540" y="120" width="70" height="38"/><rect x="618" y="120" width="70" height="38"/><rect x="696" y="120" width="70" height="38"/>
  </g>
  <text x="790" y="144" fill="#9fb0c8" font-size="12">F1 – F9 · unchanged</text>

  <!-- rail -->
  <rect x="72" y="178" width="200" height="362" fill="#0f1f3d" stroke="#ffffff" stroke-width="2"/>
  <g font-size="13" fill="#cfe0ff">
    <text x="90" y="206">Summary</text>
    <text x="90" y="232">Persons</text>
    <text x="90" y="258">Vehicles</text>
    <text x="90" y="284">Incident History</text>
    <text x="90" y="310">Comments</text>
    <text x="90" y="336">Unit Details</text>
  </g>
  <rect x="78" y="346" width="188" height="26" fill="#4ade80"/>
  <text x="90" y="364" fill="#0f1f3d" font-size="13" font-weight="700">▦ Map</text>
  <g font-size="13" fill="#cfe0ff">
    <text x="90" y="394">BOLO</text>
    <text x="90" y="420">Cite / Charge</text>
    <text x="90" y="446">My Activity</text>
  </g>

  <!-- map panel -->
  <rect x="284" y="178" width="844" height="362" fill="#16294d" stroke="#ffffff" stroke-width="4"/>
  <text x="300" y="202" fill="#4ade80" font-size="14" font-weight="700" letter-spacing="2">MAP</text>
  <rect x="300" y="212" width="110" height="22" fill="#1f3b73" stroke="#ffffff"/>
  <text x="355" y="228" fill="#ffffff" font-size="12" text-anchor="middle">Postal map</text>
  <rect x="300" y="242" width="812" height="286" fill="#05070b" stroke="#ffffff" stroke-width="2"/>
  <rect x="302" y="244" width="808" height="282" fill="url(#tiles)"/>

  <rect x="380" y="280" width="300" height="200" fill="#4a5cff" fill-opacity="0.16" stroke="#6c8cff" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="392" y="470" fill="#6c8cff" font-size="11" font-weight="700" letter-spacing="2">OVERLAY IMAGE</text>

  <circle cx="820" cy="320" r="54" fill="#6c8cff" fill-opacity="0.1" stroke="#6c8cff" stroke-width="2"/>
  <text x="820" y="325" fill="#e7ecf5" font-size="13" font-weight="700" text-anchor="middle">Paleto Valley Mall</text>

  <path d="M740 410 L960 396 L980 480 L760 500 Z" fill="#ffc34d" fill-opacity="0.1" stroke="#ffc34d" stroke-width="2"/>
  <text x="860" y="452" fill="#e7ecf5" font-size="13" font-weight="700" text-anchor="middle">Downtown</text>

  <rect x="520" y="352" width="54" height="18" rx="2" fill="#ffd24d" stroke="#000"/>
  <text x="547" y="365" fill="#000" font-size="11" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">#4471</text>
  <rect x="600" y="406" width="54" height="18" rx="2" fill="#16294d" stroke="#4ade80" stroke-width="2"/>
  <text x="627" y="419" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">1A-12</text>
  <text x="1000" y="270" fill="#9fb0c8" font-size="12">click an incident →</text>
  <text x="1000" y="286" fill="#9fb0c8" font-size="12">Active Incident</text>
</svg>
