<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4a5cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="tiles" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1d2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <g stroke="#4a5cff" stroke-width="3" fill="none">
    <path d="M28 56 V28 H56"/>
    <path d="M1172 544 V572 H1144"/>
  </g>
  <text x="60" y="58" fill="#e7ecf5" font-size="24" font-weight="700" letter-spacing="4">PENNSYLVANIA CAD — <tspan fill="#6c8cff">MAP VIEW</tspan></text>
  <text x="60" y="86" fill="#9fb0ff" font-size="15">My Call Info → Map View, next to the CAD Viewer. Clicking a call opens its Call Detail.</text>

  <!-- window -->
  <rect x="60" y="112" width="1080" height="440" fill="#dfe7f1" stroke="#6f86a6" stroke-width="2"/>
  <rect x="60" y="112" width="1080" height="28" fill="#2f5d9a"/>
  <text x="74" y="131" fill="#fff" font-size="13" font-weight="700">PENNSYLVANIA CAD — PSP</text>

  <!-- rail -->
  <rect x="68" y="148" width="120" height="396" fill="#c9d5e4" stroke="#9bafc7"/>
  <g font-size="11" fill="#24374f" font-weight="700">
    <rect x="74" y="156" width="108" height="30" fill="#eef3fa" stroke="#9bafc7"/><text x="82" y="175">F1 Location</text>
    <rect x="74" y="192" width="108" height="30" fill="#eef3fa" stroke="#9bafc7"/><text x="82" y="211">F2 Assign</text>
    <rect x="74" y="228" width="108" height="30" fill="#eef3fa" stroke="#9bafc7"/><text x="82" y="247">F3 En Route</text>
    <rect x="74" y="264" width="108" height="30" fill="#eef3fa" stroke="#9bafc7"/><text x="82" y="283">F4 On Scene</text>
  </g>

  <!-- tabs -->
  <g font-size="12" font-weight="700">
    <rect x="198" y="148" width="130" height="26" fill="#2f5d9a"/><text x="263" y="166" fill="#fff" text-anchor="middle">My Call Info</text>
    <rect x="332" y="148" width="120" height="26" fill="#eef3fa" stroke="#9bafc7"/><text x="392" y="166" fill="#24374f" text-anchor="middle">Create a Call</text>
    <rect x="456" y="148" width="80" height="26" fill="#eef3fa" stroke="#9bafc7"/><text x="496" y="166" fill="#24374f" text-anchor="middle">Query</text>
  </g>

  <!-- pane with map -->
  <rect x="198" y="182" width="934" height="316" fill="#eef3fa" stroke="#9bafc7"/>
  <rect x="206" y="190" width="84" height="20" fill="#2f5d9a" stroke="#24374f"/>
  <text x="248" y="204" fill="#fff" font-size="11" text-anchor="middle">Postal map</text>
  <rect x="206" y="216" width="918" height="274" fill="#05070b" stroke="#9bafc7" stroke-width="2"/>
  <rect x="208" y="218" width="914" height="270" fill="url(#tiles)"/>
  <rect x="260" y="240" width="300" height="220" fill="#4a5cff" fill-opacity="0.16" stroke="#6c8cff" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="820" cy="300" r="52" fill="#6c8cff" fill-opacity="0.1" stroke="#6c8cff" stroke-width="2"/>
  <text x="820" y="305" fill="#e7ecf5" font-size="13" font-weight="700" text-anchor="middle">Mission Row PD</text>
  <rect x="380" y="330" width="70" height="18" rx="2" fill="#b3261e" stroke="#000"/>
  <text x="415" y="343" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">26-4471</text>
  <rect x="470" y="400" width="44" height="18" rx="2" fill="#24374f" stroke="#fff" stroke-width="2"/>
  <text x="492" y="413" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">T-21</text>
  <text x="415" y="322" fill="#9fb0c8" font-size="12" text-anchor="middle">click → Call Detail</text>

  <!-- sub-tabs -->
  <g font-size="12" font-weight="700">
    <rect x="198" y="506" width="110" height="26" fill="#eef3fa" stroke="#9bafc7"/><text x="253" y="524" fill="#24374f" text-anchor="middle">CAD Viewer</text>
    <rect x="312" y="506" width="100" height="26" fill="#2f5d9a"/><text x="362" y="524" fill="#fff" text-anchor="middle">Map View</text>
    <rect x="416" y="506" width="96" height="26" fill="#eef3fa" stroke="#9bafc7"/><text x="464" y="524" fill="#24374f" text-anchor="middle">Call Detail</text>
    <rect x="516" y="506" width="130" height="26" fill="#eef3fa" stroke="#9bafc7"/><text x="581" y="524" fill="#24374f" text-anchor="middle">Call History View</text>
  </g>
</svg>
